<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.CASE_ARENA_YANDEX_BUILD = true;</script>
<script src="/sdk.js"></script>
<title>Кейс Арена</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;600;800&family=Russo+One&display=swap" rel="stylesheet">
<style>
/* Layout: sticky bar (balance, ad, sound) over a four-tab strip; one workbench at a time.
   Opening a case puts the reels first and the full drop table below them.
   Palette: gunmetal ground, brass for money and the main action, teal for wins, red for losses; item colors come from rarity tiers.
   Type: Russo One for headings and buttons, Manrope for text, JetBrains Mono for every price. */
:root{
  --bg:#0e141a;--panel:#151d26;--panel2:#1b2632;--line:#273443;--line2:#3a4b61;
  --fg:#e9eef3;--muted:#8e9db0;--brass:#e8b24a;--brass2:#f6d283;--ink:#221704;
  --win:#35c7a6;--lose:#ee5b5b;
  --display:"Russo One","Arial Black",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;min-height:100%;padding-block:0 40px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.02em;text-wrap:balance}
h2{font-size:22px}
h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;min-height:36px;padding:0 8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}

/* top bar */
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(14,20,26,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:18px;letter-spacing:.05em;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.bank{display:flex;align-items:center;gap:8px;min-width:0}
.bal{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.bal .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bal b{font-size:16px;color:var(--brass2);white-space:nowrap}
.bal.up{animation:flashUp .8s}.bal.down{animation:flashDown .8s}
@keyframes flashUp{0%{background:rgba(53,199,166,.38)}100%{background:var(--panel)}}
@keyframes flashDown{0%{background:rgba(238,91,91,.34)}100%{background:var(--panel)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:8px;background:var(--brass);color:var(--ink);font-family:var(--display);font-size:14px;letter-spacing:.03em;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.big{min-height:50px;font-size:16px;padding:0 24px}
.btn.danger{background:var(--lose);color:#fff}
.btn.ad{background:var(--panel2);color:var(--brass2);border:1px solid var(--line2);padding:0 12px}
.btn.ad svg{width:14px;height:14px}
.btn.ad.pulse{animation:pulse 1.4s infinite;border-color:var(--brass)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,178,74,.6)}70%{box-shadow:0 0 0 10px rgba(232,178,74,0)}100%{box-shadow:0 0 0 0 rgba(232,178,74,0)}}
.icon{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
.icon svg{width:20px;height:20px}
.icon.off{color:var(--muted)}
@media(max-width:560px){.brand span{display:none}.bank{flex:1;justify-content:flex-end}}
.tabs{display:flex;gap:4px;padding-block:0 8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-height:40px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--panel2);color:var(--brass2);box-shadow:inset 0 -2px 0 var(--brass)}
.tabs .n{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:9px;background:var(--line);color:var(--fg)}
body.busy .tabs button:not(.on){opacity:.45;pointer-events:none}
#app{padding-block:18px 0}

/* common blocks */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.note{padding:10px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);margin-bottom:14px}
.note.warn{border-color:var(--brass)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{padding:18px 6px;text-align:center;color:var(--muted)}
.foot{margin-top:26px;color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* case list */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ccard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:center;min-width:0;transition:transform .15s,border-color .15s,background .15s}
.ccard:hover{transform:translateY(-3px);border-color:var(--a);background:var(--panel2)}
.ccard svg{width:100%;max-width:130px;height:auto}
.ccard .cn{font-family:var(--display);font-size:15px;margin-top:2px}
.ccard .cp{font-family:var(--mono);font-weight:700;color:var(--brass2);font-size:14px}
.ccard .ct{font-size:11px;color:var(--muted)}

/* items */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.it{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 7px;border-radius:7px;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 20%,var(--panel)) 0%,var(--panel) 85%);border:1px solid color-mix(in srgb,var(--rc) 35%,var(--line));text-align:center;min-width:0;color:var(--fg)}
.it svg{width:54px;height:54px;filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--rc) 45%,transparent))}
.it .tn{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rl);font-weight:800}
.it .nm{font-size:11.5px;font-weight:600;line-height:1.2;min-height:2.4em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%}
.it .pr{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--brass2)}
.it .bd{position:absolute;top:4px;left:5px;font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.45);color:var(--win)}
.it.pick{cursor:pointer;transition:transform .12s,border-color .12s}
.it.pick:hover{transform:translateY(-2px);border-color:var(--rc)}
.it.pick.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.it.pick.sel::after{content:"✓";position:absolute;top:2px;right:6px;color:var(--brass2);font-weight:800}
.it.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* case view */
.crumb{margin-bottom:10px}
.chead{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.cprice{font-size:20px;color:var(--brass2);font-weight:700}
.stage{display:flex;flex-direction:column;gap:8px;margin-block:14px}
.reel{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#0a0f14;height:156px}
.reel.sm{height:108px}
.strip{position:relative;display:flex;gap:6px;padding:8px;height:100%;will-change:transform}
.rc{flex:0 0 auto;width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:7px;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 24%,#0e151c),#0e151c 85%);border:1px solid color-mix(in srgb,var(--rc) 40%,#1d2a38);padding:6px 4px;min-width:0}
.rc svg{width:62px;height:62px;filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--rc) 40%,transparent))}
.rc .rn{font-size:10.5px;font-weight:600;text-align:center;line-height:1.15;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rc .rp{font-size:11px;color:var(--brass2);font-weight:700}
.reel.sm .rc{width:92px}
.reel.sm .rc svg{width:44px;height:44px}
.reel.sm .rn{display:none}
.reel::before{content:"";position:absolute;z-index:2;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--brass);box-shadow:0 0 14px 2px rgba(232,178,74,.55)}
.reel::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#0a0f14 0%,transparent 14%,transparent 86%,#0a0f14 100%)}
.rc.dim{opacity:.3;transition:opacity .4s}
.rc.win{box-shadow:0 0 0 2px var(--rc),0 0 22px color-mix(in srgb,var(--rc) 60%,transparent)}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.qty{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.qty button{width:40px;height:40px;border:0;background:var(--panel2);font-size:20px;line-height:1}
.qty output{min-width:44px;text-align:center;font-family:var(--mono);font-weight:700;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;min-width:46px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:transparent;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--fg)}
.chip.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--brass)}
.ctl .btn.big{margin-left:auto}
@media(max-width:560px){.ctl .btn.big{margin-left:0;flex:1 1 100%}}
.drop{margin-top:14px;padding:14px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;gap:12px}
.drop.flash{animation:glow 1.6s}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(232,178,74,.8)}100%{box-shadow:0 0 0 24px rgba(232,178,74,0)}}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dh .big{font-size:24px;font-weight:700;color:var(--brass2)}
.delta{font-size:18px;font-weight:700}
.delta.pos{color:var(--win)}.delta.neg{color:var(--lose)}
.band{margin-top:16px}
.bh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bh i{width:10px;height:10px;border-radius:50%;flex:none}
.bh b{font-family:var(--display);font-weight:400;font-size:15px}
.bh .mono{color:var(--brass2);font-weight:700}
.sub-h{margin:22px 0 2px}

/* upgrade + contract layout */
.two{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:800px){.two{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
.wheelp{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.wheelbox{position:relative;width:min(100%,300px);aspect-ratio:1;margin:0 auto}
.wheelbox svg.w{position:absolute;inset:0;width:100%;height:100%}
.ptr{position:absolute;inset:0}
.ptr svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.wtxt{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:2px;padding:0 24%}
.wtxt b{font-size:30px;line-height:1.1}
.wtxt span{font-size:11px;line-height:1.25;max-height:3.8em;overflow:hidden}
.wtxt b.res-win{color:var(--win);font-family:var(--display);font-weight:400;font-size:24px}
.wtxt b.res-lose{color:var(--lose);font-family:var(--display);font-weight:400;font-size:24px}.wtxt b.res-jackpot{color:var(--brass2);font-family:var(--display);font-weight:400;font-size:22px}
.chips.wide .chip{flex:1}
.pickh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pickh b{color:var(--brass2)}
.umsg{min-height:0}
.machine{display:flex;flex-direction:column;gap:14px}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.slot{aspect-ratio:1;border:1px dashed var(--line2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.slot.f{border-style:solid;border-color:color-mix(in srgb,var(--rc) 55%,var(--line));background:color-mix(in srgb,var(--rc) 14%,var(--panel))}
.slot svg{width:60%;height:auto}
.slot .mono{font-size:10px;color:var(--brass2);font-weight:700}
.slots.shake .slot.f{animation:shake .18s infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-2deg)}50%{transform:translate(2px,-1px) rotate(2deg)}75%{transform:translate(-1px,-2px) rotate(-1deg)}100%{transform:translate(0,0) rotate(0)}}
.mrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mrow b{color:var(--brass2)}
.obar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.obar i{display:block;min-width:3px}
.olist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.olist li{display:grid;grid-template-columns:10px minmax(0,1fr) auto 44px;gap:8px;align-items:center}
.olist li i{width:10px;height:10px;border-radius:50%}
.olist li b{text-align:right;font-size:13px}
.olist li span.mono{font-size:12px;color:var(--muted)}
@media(max-width:560px){.olist li{grid-template-columns:10px minmax(0,1fr) 44px}.olist li span.mono{display:none}}
@media(max-width:420px){.tabs button{font-size:12.5px;padding:0 11px}}
.cres{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2)}
.cres .it{width:130px;flex:none}
.cres .q{width:130px;height:150px;display:grid;place-items:center;font-family:var(--display);font-size:56px;color:var(--brass2);border:1px dashed var(--brass);border-radius:8px;animation:pulseQ 1s infinite}
@keyframes pulseQ{50%{opacity:.45}}
.verdict{font-family:var(--display);font-size:22px}
.verdict.v0{color:var(--lose)}.verdict.v1{color:var(--muted)}.verdict.v2{color:var(--win)}.verdict.v3{color:var(--brass2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.stat{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.stat span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--mono);color:var(--brass2);font-size:15px}

/* live drop feed */
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--win);box-shadow:0 0 8px rgba(53,199,166,.7);flex:none;animation:livePulse 1.8s infinite}
@keyframes livePulse{50%{opacity:.45;box-shadow:0 0 2px rgba(53,199,166,.3)}}
.dropfeed-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dropfeed-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.dropfeed-list{display:flex;flex-direction:column;gap:7px}
.df-item{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:linear-gradient(100deg,color-mix(in srgb,var(--dfc) 10%,var(--panel)),var(--panel) 55%);min-width:0;transition:border-color .2s,background .2s}
.df-item.fresh{animation:dfFresh 1.2s ease-out;border-color:var(--dfc)}
@keyframes dfFresh{0%{background:color-mix(in srgb,var(--dfc) 30%,var(--panel));transform:translateY(-3px)}100%{transform:translateY(0)}}
.df-swatch{height:43px;border-radius:5px;background:var(--dfc);box-shadow:0 0 12px color-mix(in srgb,var(--dfc) 35%,transparent)}
.df-info{min-width:0;display:flex;flex-direction:column;gap:4px}
.df-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.df-name{font-size:13px;overflow-wrap:anywhere}
.df-tier{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;color:var(--dfc);background:color-mix(in srgb,var(--dfc) 14%,transparent);border:1px solid color-mix(in srgb,var(--dfc) 32%,transparent);white-space:nowrap}
.df-meta{display:flex;gap:5px 9px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.df-meta span{overflow-wrap:anywhere}
.df-price{color:var(--brass2);font:700 13px var(--mono);white-space:nowrap;text-align:right}
 .dropfeed-empty{padding:30px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:9px}
/* persistent live ticker */
.drop-ticker{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(12,15,20,.97);border-top:1px solid var(--brass);box-shadow:0 -8px 28px rgba(0,0,0,.3);backdrop-filter:blur(12px);height:76px;display:flex;align-items:center;overflow:hidden}
.drop-ticker-label{height:100%;flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 14px;border-right:1px solid var(--line2);background:linear-gradient(135deg,rgba(232,178,74,.16),transparent)}
.drop-ticker-label b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass2)}.drop-ticker-label span{font-size:10px;color:var(--muted)}
.drop-ticker-viewport{overflow:hidden;flex:1;min-width:0}.drop-ticker-track{display:flex;align-items:center;gap:10px;width:max-content;animation:dropTickerScroll 100s linear infinite}.drop-ticker:hover .drop-ticker-track{animation-play-state:paused}.drop-ticker.is-paused .drop-ticker-track{animation-play-state:paused}.ticker-pause{margin-top:3px;background:rgba(255,255,255,.07);border:1px solid var(--line2);border-radius:5px;color:var(--text);font-size:10px;padding:3px 7px;cursor:pointer;white-space:nowrap}.ticker-pause:hover{border-color:var(--brass);color:var(--brass2)}
@keyframes dropTickerScroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.dt-item{display:flex;align-items:center;gap:8px;min-width:205px;max-width:260px;padding:7px 10px;border:1px solid color-mix(in srgb,var(--dtc) 45%,var(--line));border-radius:8px;background:linear-gradient(100deg,color-mix(in srgb,var(--dtc) 12%,var(--panel)),var(--panel));}
.dt-art{width:39px;height:39px;flex:none;display:grid;place-items:center;border-radius:7px;background:color-mix(in srgb,var(--dtc) 17%,#15191f);border:1px solid color-mix(in srgb,var(--dtc) 50%,transparent);color:var(--dtc);font-size:21px;box-shadow:inset 0 0 12px color-mix(in srgb,var(--dtc) 12%,transparent)}

function buildCase(d,i){
  const fam=d.f?new Set(d.f.map(k=>FAMS.findIndex(x=>x.k===k))):null;
  const pool=ITEMS.filter(it=>!fam||fam.has(it.fam));
  const bands=BANDS.map((def,bi)=>{
    const items=pool.filter(it=>it.price>=def.lo*d.p&&it.price<def.hi*d.p).sort((x,y)=>y.price-x.price);
    return {bi,def,items,mean:items.length?items.reduce((s,x)=>s+x.price,0)/items.length:0,prob:0};
  }).filter(b=>b.items.length);
  const target=d.rtp*d.p;
  const probs=lam=>{const w=bands.map(b=>b.def.b*Math.pow(lam,b.bi));const s=w.reduce((x,y)=>x+y,0);return w.map(x=>x/s);};
  const ev=lam=>{const p=probs(lam);return bands.reduce((s,b,k)=>s+p[k]*b.mean,0);};
  let lo=.02,hi=60,lam;
  if(ev(hi)<=target)lam=hi;else if(ev(lo)>=target)lam=lo;
  else{for(let k=0;k<50;k++){const mid=Math.sqrt(lo*hi);if(ev(mid)<target)lo=mid;else hi=mid;}lam=Math.sqrt(lo*hi);}
  const p=probs(lam);bands.forEach((b,k)=>{b.prob=p[k];});
  const hue=(i*37+12)%360;
  const all=bands.reduce((s,b)=>s+b.items.length,0);
  const max=Math.max.apply(null,bands.map(b=>b.items[0].price));
  return {i,name:d.n,price:d.p,bands,rtp:ev(lam)/d.p,count:all,max,hue,art:d.a,
    a:'hsl('+hue+',68%,58%)',ad:'hsl('+hue+',55%,30%)',al:'hsl('+hue+',75%,74%)'};
}
const CASES=CASE_DEFS.map(buildCase);
function pickItem(c,boost){
  const w=c.bands.map(b=>b.prob*(1+(boost||0)*b.bi/3));
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let k=0;k<w.length;k++){r-=w[k];if(r<=0){const it=c.bands[k].items;return it[Math.floor(Math.random()*it.length)];}}
  const l=c.bands[c.bands.length-1].items;return l[l.length-1];
}

function pickNear(price){
  const near=ITEMS.filter(it=>it.price>=price*.9&&it.price<=price*1.12);
  if(near.length)return near[Math.floor(Math.random()*near.length)];
  const s=ITEMS.slice().sort((a,b)=>Math.abs(a.price-price)-Math.abs(b.price-price)).slice(0,3);
  return s[Math.floor(Math.random()*s.length)];
}

async function loadDrops(initial){
  const base=apiBase(),token=++state.dropFeedRequest,status=$('#dropFeedStatus'),list=$('#dropFeedList');
  if(!base){if(status)status.textContent='Сервер не подключён. Открой игру через опубликованный сайт.';if(list)list.innerHTML='<div class="dropfeed-empty">Для общей ленты нужен подключённый онлайн-сервер.</div>';return;}
  if(status&&initial)status.textContent='Подключаюсь к серверу…';
  try{
    const resp=await fetch(base+'/api/drops?limit=60',{cache:'no-store'});if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();if(token!==state.dropFeedRequest)return;
    const rows=Array.isArray(data.entries)?data.entries:[];
    if(list)list.innerHTML=dropRowsHTML(rows);
    if(status)status.textContent='Подключено · записей в ленте: '+(Number(data.total)||rows.length)+' · обновлено в '+dropTime(Date.now());
    rows.forEach(r=>state.dropFeedSeen.add(String(r.id)));state.dropFeedInitialized=true;
    if(state.dropFeedSeen.size>300)state.dropFeedSeen=new Set(rows.map(r=>String(r.id)));
  }catch(e){if(token!==state.dropFeedRequest)return;if(status)status.textContent='Не удалось загрузить ленту. Проверь подключение к серверу.';if(list&&!list.children.length)list.innerHTML='<div class="dropfeed-empty">Сервер временно недоступен. Попробуй обновить.</div>';}
}

/* ===== sound ===== */
const sfx=(function(){
  let ac=null;
  function ctx(){
    if(!S.sound)return null;
    try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}catch(e){return null;}
  }
  function beep(f,d,type,vol,when){
    const a=ctx();if(!a)return;
    try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(when||0);
      g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
  }
  return {
    pause(){try{if(ac&&ac.state==='running')ac.suspend();}catch(e){}},
    resume(){try{if(ac&&ac.state==='suspended'&&S.sound)ac.resume();}catch(e){}},
    tick(){beep(820+Math.random()*160,.05,'square',.02);},
    win(lv){const n=2+Math.min(4,lv);for(let i=0;i<n;i++)beep(440*Math.pow(1.26,i),.22,'triangle',.06,i*.09);},
    lose(){beep(190,.3,'sawtooth',.035);beep(135,.35,'sawtooth',.035,.12);},
    coin(){beep(1200,.08,'square',.035);beep(1600,.12,'square',.035,.07);}
  };
})();

function updateActions(){
  const ob=$('#openBtn');
  if(ob){
    const c=state.curCase;
    if(state.busy){ob.textContent='Пропустить';ob.dataset.act='skip';ob.disabled=false;}
    else if(c.free){
      ob.dataset.act='spin';
      if(dailyInfo().can){ob.textContent='Забрать бесплатно';ob.disabled=false;}
      else{ob.textContent='Уже забрано сегодня';ob.disabled=true;}
    }

      const cost=c.price*S.qty;ob.dataset.act='spin';
      if(S.money<cost){ob.textContent='Не хватает '+fmt(cost-S.money);ob.disabled=true;}
      else{ob.textContent='Открыть ×'+S.qty+' · '+fmt(cost);ob.disabled=false;}

  const bb=$('#btBtn');

    const B=state.bt,cost=btCost();

      else{bb.textContent='Начать битву · '+fmt(cost);bb.disabled=false;}

function reelCard(it){const t=TIERS[it.tier];return '<div class="rc" style="--rc:'+t.c+';--rl:'+t.l+'">'+svgFor(it)+'<span class="rn">'+esc(it.name)+'</span><span class="rp mono">'+fmt(it.price)+'</span></div>';}
function geom(reel){
  const strip=reel.firstElementChild,cards=strip.children;
  let step=cards.length>1?cards[1].offsetLeft-cards[0].offsetLeft:0;
  const sm=reel.classList.contains('sm');
  if(!step||step<=0)step=sm?98:126;
  return {strip,step,cw:cards[0].offsetWidth||step-6,vw:reel.clientWidth||600,pad:cards[0].offsetLeft||8};
}
function renderStage(){
  const st=$('#stage');if(!st||state.busy)return;
  const c=state.curCase;const n=c.free?1:S.qty;
  st.innerHTML=Array.from({length:n},()=>{
    const arr=Array.from({length:25},()=>pickItem(c,1.4));
    return '<div class="reel'+(n>1?' sm':'')+'"><div class="strip">'+arr.map(reelCard).join('')+'</div></div>';
  }).join('');
  $$('.reel',st).forEach(r=>{const g=geom(r);g.strip.style.transform='translate3d('+(-(g.pad+12*g.step+g.cw/2-g.vw/2))+'px,0,0)';});
}
function runReels(reels,fast,baseMs){
  return new Promise(resolve=>{
    const base=baseMs||(fast?1300:(RM?2200:5600));
    const t0=performance.now();let lastIdx=-1;
    reels.forEach((r,i)=>{r.dur=base+i*(fast?60:160);});
    function frame(now){
      let all=true;
      reels.forEach((r,i)=>{
        const t=state.skip?1:Math.min(1,(now-t0)/r.dur);
        const e=1-Math.pow(1-t,4);
        r.strip.style.transform='translate3d('+(-(r.target*e)).toFixed(1)+'px,0,0)';
        if(i===0){const idx=Math.floor((r.target*e+r.vw/2-r.pad)/r.step);if(idx!==lastIdx){lastIdx=idx;if(t<1)sfx.tick();}}
        if(t<1)all=false;
      });
      if(all)resolve();else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}
async function spin(){
  if(state.busy||state.curCase==null)return;
  const c=state.curCase,n=c.free?1:S.qty,cost=c.free?0:c.price*n;
  let dinfo=null;
  if(c.free){dinfo=dailyInfo();if(!dinfo.can){toast('Сегодня бонус уже забран. Приходи завтра.');return;}}
  if(S.money<cost){toast('Не хватает '+fmt(cost-S.money)+'. Продай предметы или посмотри рекламу.');return;}
  state.skip=false;state.drop=null;state.newCount=0;
  if(dinfo)S.daily={last:dinfo.today,streak:dinfo.streak};
  S.money-=cost;S.stats.opened+=n;S.stats.spent+=cost;
  const wins=Array.from({length:n},()=>pickItem(c));
  const entries=wins.map(it=>{S.stats.best=Math.max(S.stats.best,it.price);return addItem(it);});
  save();
  lock();
  $('#drop').innerHTML='';
  const WIN=48+Math.floor(Math.random()*6);
  const st=$('#stage');
  st.innerHTML=wins.map(w=>{
    const arr=Array.from({length:64},()=>pickItem(c,1.4));arr[WIN]=w;
    return '<div class="reel'+(n>1?' sm':'')+'"><div class="strip">'+arr.map(reelCard).join('')+'</div></div>';
  }).join('');
  const reels=$$('.reel',st).map(r=>{
    const g=geom(r);
    g.target=g.pad+WIN*g.step+g.cw/2+rnd(-.36,.36)*g.cw-g.vw/2;
    g.el=r;return g;
  });
  await sleep(60);
  await runReels(reels,S.fast);
  reels.forEach(r=>{$$('.rc',r.el).forEach((el,i)=>{if(i===WIN)el.classList.add('win');else el.classList.add('dim');});});
  const total=wins.reduce((s,w)=>s+w.price,0);
  const hit=wins.some(w=>w.price>=c.price*9);
  if(!c.free){if(total<cost){S.stats.lost=(S.stats.lost||0)+(cost-total);S.stats.losses=(S.stats.losses||0)+1;}else if(total>cost)S.stats.wins=(S.stats.wins||0)+1;save();}
  state.drop={wins,uids:entries.map(e=>e.uid),cost,total,sold:false,hit,fresh:state.newCount};
  publishDrops(c,wins);
  if(hit)sfx.win(6);else if(total>=cost)sfx.win(1);else sfx.lose();
  unlock();
  showDrop(state.drop);
  if(hit)toast('Крупный дроп!');
}

/* ===== view: upgrade ===== */
const CIRC=2*Math.PI*108;
function upStake(){let s=Math.max(0,Math.floor(+state.up.cash||0));state.up.sel.forEach(u=>{const e=entry(u);if(e)s+=ITEMS[e.id].price;});return s;}
// Коэффициенты апгрейда заданы отдельно для каждого режима.
// Поражение во всех режимах возвращает 25% от общей ставки.
const UPGRADE_MODES={
  '0.5': {normalChance:.50,jackpotChance:0,normalCoef:2.0,jackpotCoef:0,minStake:0},
  '0.75':{normalChance:.75,jackpotChance:0,normalCoef:1.45,jackpotCoef:0,minStake:0},
  '0.3': {normalChance:.29,jackpotChance:.01,normalCoef:3.3,jackpotCoef:12,minStake:10000},
  '0.1': {normalChance:.095,jackpotChance:.005,normalCoef:9.0,jackpotCoef:60,minStake:100000}
};
function upgradeMode(){return UPGRADE_MODES[String(state.up.chance)]||UPGRADE_MODES['0.5'];}
const upChance=()=>{const m=upgradeMode();return m.normalChance+m.jackpotChance;};
function upCands(){
  const s=upStake();if(s<=0)return [];
  const U=state.up,m=upgradeMode(),ideal=s*m.normalCoef;
  const family=it=>U.fam==='all'||FAMS[it.fam].k===U.fam;
  // Целевая цена не превышает коэффициент обычного выигрыша; разница
  // между ценой предмета и выплатой до коэффициента компенсируется деньгами.
  let pool=ITEMS.filter(it=>family(it)&&it.price<=ideal);
  if(!pool.length)return [];
  const near=pool.filter(it=>it.price>=ideal*.55);
  return (near.length?near:pool)
    .sort((a,b)=>Math.abs(Math.log(Math.max(1,a.price)/Math.max(1,ideal)))-Math.abs(Math.log(Math.max(1,b.price)/Math.max(1,ideal))))
    .slice(0,24);
}

async function doUpgrade(){
  const U=state.up;
  if(state.busy||U.target==null||!U.sel.size)return;
  const cash=Math.min(Math.max(0,Math.floor(+U.cash||0)),S.money);
  const stake=upStake(),it=ITEMS[U.target],mode=upgradeMode();
  if(cash>S.money){toast('Не хватает денег на доплату.');return;}
  if(mode.minStake&&stake<mode.minStake){toast('Для режима '+Math.round(U.chance*100)+'% минимальная общая ставка — '+fmt(mode.minStake)+'.');return;}
  const roll=Math.random(),totalChance=mode.normalChance+mode.jackpotChance;
  const jackpot=mode.jackpotChance>0&&roll>=mode.normalChance&&roll<totalChance;
  const normalWin=roll<mode.normalChance;
  const win=normalWin||jackpot;
  const coef=jackpot?mode.jackpotCoef:mode.normalCoef;
  const ch=totalChance,normalArc=mode.normalChance*360,totalArc=ch*360;
  let ang;
  if(normalWin)ang=rnd(1,Math.max(2,normalArc-1));
  else if(jackpot)ang=rnd(normalArc+.1,Math.max(normalArc+.2,totalArc-.1));
  else ang=rnd(Math.min(356,totalArc+1),357);
  lock();U.res=null;
  S.money-=cash;U.cash=0;
  removeUids(new Set(U.sel));
  S.stats.upgrades=(S.stats.upgrades||0)+1;
  if(win){addItem(it);S.stats.best=Math.max(S.stats.best,it.price);S.stats.upgradeWins=(S.stats.upgradeWins||0)+1;S.stats.wins=(S.stats.wins||0)+1;if(jackpot)S.stats.upgradeJackpots=(S.stats.upgradeJackpots||0)+1;}
  save();updateTop();$('#upMsg').innerHTML='';
  const dur=S.fast?1400:(RM?2200:5200),ptr=$('#ptr');
  U.rot=U.rot+360*(5+Math.floor(Math.random()*3))+(((ang-(U.rot%360))%360)+360)%360;
  ptr.style.transition='transform '+dur+'ms cubic-bezier(.10,.72,.08,1)';
  ptr.style.transform='rotate('+U.rot+'deg)';
  let ticking=true,tickTimer=0;const tickStart=performance.now();
  function tickWheel(){if(!ticking)return;sfx.tick();const p=Math.min(1,(performance.now()-tickStart)/dur);tickTimer=setTimeout(tickWheel,42+360*p*p);}
  tickWheel();
  await sleep(dur+80);ticking=false;clearTimeout(tickTimer);
  U.res=jackpot?'jackpot':win?'win':'lose';let cashback=0,bonus=0;
  if(win){
    // Целевой предмет плюс денежная часть дают ровно заданный коэффициент от общей ставки.
    bonus=Math.max(0,Math.floor(stake*coef-it.price));
    S.money+=bonus;S.stats.earned=(S.stats.earned||0)+bonus;
    sfx.win(Math.min(6,Math.round(Math.log(Math.max(1,coef))/Math.log(1.8))));
  }else{
    cashback=Math.floor(stake*.25);S.money+=cashback;S.stats.earned=(S.stats.earned||0)+cashback;
    S.stats.lost=(S.stats.lost||0)+Math.max(0,stake-cashback);S.stats.losses=(S.stats.losses||0)+1;S.stats.upgradeLosses=(S.stats.upgradeLosses||0)+1;sfx.lose();
  }
  save();updateTop();
  $('#upMsg').innerHTML=win?'<div class="cres">'+card(it,{cls:'pop'})+'<div><div class="verdict v2">'+(jackpot?'ДЖЕКПОТ!':'Цель получена')+'</div><div class="muted">'+(jackpot?'Джекпот выпал с шансом '+pct(mode.jackpotChance)+'. ':'Обычный выигрыш с шансом '+pct(mode.normalChance)+'. ')+'Коэффициент '+('×'+mCoef(coef))+'.</div><div class="mono">Ставка '+fmt(stake)+' · денежная доплата к награде '+fmt(bonus)+'</div></div></div>':
    '<div class="cres"><div><div class="verdict v0">Не повезло</div><div class="muted">Шанс выигрыша был '+pct(ch)+'. Потеряно '+fmt(Math.max(0,stake-cashback))+' с учётом возврата.</div><div class="verdict v2">+'+fmt(cashback)+' возврат · 25%</div></div></div>';
  U.sel.clear();U.target=null;
  unlock();ptr.style.transition='none';drawUpInv();refreshUp();
}

function ctItems(){state.ct.sel.forEach(u=>{if(!entry(u))state.ct.sel.delete(u);});return Array.from(state.ct.sel).map(u=>ITEMS[entry(u).id]);}
const CONTRACT_RETURN=.97;
function contractBands(risk){
  const r=Math.max(0,Math.min(1,risk||0));
  const bands=[
    {n:'Провал',lo:.08-.04*r,hi:.9,c:'#ee5b5b',p:.64+.07*r},
    {n:'Около нуля',lo:.9,hi:1.5+.25*r,c:'#8e9db0',p:.24-.02*r},
    {n:'Хороший',lo:1.5,hi:3+1.5*r,c:'#35c7a6',p:.09-.035*r},
    {n:'Джекпот',lo:3,hi:6+6*r,c:'#e8b24a',p:.03-.015*r}
  ];
  // Сохраняем распределение исходов, но масштабируем их так, чтобы
  // среднее математическое ожидание было 97% от стоимости контракта.
  const rawEV=bands.reduce((sum,b)=>sum+b.p*(b.lo+b.hi)/2,0);
  const scale=CONTRACT_RETURN/rawEV;
  return bands.map(b=>({...b,lo:b.lo*scale,hi:b.hi*scale}));
}
function rollContract(risk){
  const bands=contractBands(risk);let r=Math.random(),acc=0;
  for(const b of bands){acc+=b.p;if(r<acc)return rnd(b.lo,b.hi);}
  const b=bands[bands.length-1];return rnd(b.lo,b.hi);
}
function oddsHTML(V,risk){
  const bands=contractBands(risk),ev=bands.reduce((s,b)=>s+b.p*(b.lo+b.hi)/2,0);
  return '<div class="obar">'+bands.map(b=>'<i style="flex:'+b.p+';background:'+b.c+'"></i>').join('')+'</div>'+    '<ul class="olist">'+bands.map(b=>'<li><i style="background:'+b.c+'"></i><span>'+b.n+'</span><span class="mono">'+fmt(V*b.lo)+' – '+fmt(V*b.hi)+'</span><b class="mono">'+Math.round(b.p*100)+'%</b></li>').join('')+'</ul>'+    '<p class="muted" style="margin-top:8px">Расчётный средний возврат ≈ '+Math.round(ev*100)+'% ставки. Это игровая случайность, гарантии прибыли нет.</p>';
}

}
async function doBattle(){
  if(state.busy)return;
  const B=state.bt,c=CASES[B.ci],n=B.rounds,cost=c.price*n;
  if(S.money<cost){toast('Не хватает '+fmt(cost-S.money)+'. Продай предметы или посмотри рекламу.');return;}
  state.skip=false;state.newCount=0;state.btDrop=null;
  S.money-=cost;S.stats.opened+=n;S.stats.spent+=cost;
  const you=Array.from({length:n},()=>pickItem(c)),bot=Array.from({length:n},()=>pickItem(c));
  const ty=you.reduce((s,i)=>s+i.price,0),tb=bot.reduce((s,i)=>s+i.price,0);
  const win=ty===tb?Math.random()<.5:(B.mode==='top'?ty>tb:ty<tb);
  const uids=[];
  if(win){you.concat(bot).forEach(it=>{S.stats.best=Math.max(S.stats.best,it.price);uids.push(addItem(it).uid);});S.stats.wins=(S.stats.wins||0)+1;}
  else{S.stats.lost=(S.stats.lost||0)+cost;S.stats.losses=(S.stats.losses||0)+1;}
  const fresh=state.newCount;
  save();lock();
  $('#btRes').innerHTML='';
  const WIN=36+Math.floor(Math.random()*5);
  const st=$('#btStage');
  st.innerHTML=bHead()+Array.from({length:n},(_,r)=>{
    const a=Array.from({length:52},()=>pickItem(c,1.4)),b=Array.from({length:52},()=>pickItem(c,1.4));
    a[WIN]=you[r];b[WIN]=bot[r];
    return '<div class="brow">'+bReel(a)+bReel(b)+'</div>';
  }).join('');
  const els=$$('.reel',st);
  const groups=[];
  for(let r=0;r<n;r++){
    groups.push([els[r*2],els[r*2+1]].map(el=>{const g=geom(el);g.target=g.pad+WIN*g.step+g.cw/2+rnd(-.36,.36)*g.cw-g.vw/2;g.el=el;return g;}));
  }
  await sleep(60);
  let sy=0,sb=0;
  for(let r=0;r<n;r++){
    await runReels(groups[r],S.fast,S.fast?1000:(RM?1800:3600));
    groups[r].forEach(g=>$$('.rc',g.el).forEach((el,i)=>el.classList.add(i===WIN?'win':'dim')));
    sy+=you[r].price;sb+=bot[r].price;
    $('#btYou').textContent=fmt(sy);$('#btBot').textContent=fmt(sb);
    const lead=sy===sb?0:((B.mode==='top')===(sy>sb)?1:2);
    $('#btYouBox').classList.toggle('lead',lead===1);$('#btBotBox').classList.toggle('lead',lead===2);
    if(r<n-1&&!state.skip)await sleep(S.fast?150:500);
  }
  $((win?'#btYouBox':'#btBotBox')).classList.add('won');
  if(win)sfx.win(5);else sfx.lose();
  state.btDrop={uids,win,ty,tb,cost,total:ty+tb,items:you.concat(bot),sold:false,fresh,mode:B.mode};
  unlock();
  showBt();
}

  const d=state.btDrop,box=$('#btRes');if(!d||!box)return;
  const net=d.win?d.total-d.cost:-d.cost;
  box.innerHTML='<div class="drop'+(d.win?' flash':'')+'" style="margin-top:12px"><div class="dh"><div><div class="verdict '+(d.win?'v3':'v0')+'">'+(d.win?'Победа':'Поражение')+'</div>'+

/* ===== rocket ===== */
const RK_K=.12;
const rk={phase:'idle',bet:0,crash:1,t0:0,t:0,m:1,raf:0,ctx:null,w:300,h:280,dpr:1};
const genCrash=()=>{const r=Math.random();return Math.min(500,Math.max(1,Math.floor(97/(1-r))/100));};
const mtxt=m=>m.toFixed(2).replace('.',',')+'×';
function viewRocket(app){
  rk.phase='idle';rk.t=0;rk.m=1;
  app.innerHTML=
    '<div class="sec-h"><h2>Ракета</h2><span class="muted">Множитель растёт, пока ракета летит. Забери выигрыш до взрыва.</span></div>'+
    '<div class="two rk"><section class="panel"><div class="rkbox" id="rkbox"><canvas id="rkc"></canvas><div class="rkm mono" id="rkm">1,00×</div><div class="rkmsg" id="rkmsg">Выбери ставку и запускай</div></div><div class="hist" id="rkh"></div></section>'+
    '<section class="panel stack">'+
      '<div class="range-field"><div class="range-head"><label class="fl" for="rkBetRange">Ставка, ₽</label><b class="range-value" id="rkBetValue">'+fmt(Math.min(S.bet,S.money))+'</b></div><input class="range-input" id="rkBetRange" type="range" min="10" max="'+Math.max(10,Math.floor(S.money/10)*10)+'" step="10" value="'+Math.max(10,Math.min(Math.floor(S.bet/10)*10,Math.floor(S.money/10)*10))+'"><div class="range-ends"><span>10 ₽</span><span>'+fmt(S.money)+' ₽</span></div><input id="rkBet" type="number" inputmode="numeric" min="10" step="10" max="'+S.money+'" value="'+Math.max(10,Math.min(S.bet,S.money))+'" aria-label="Точная сумма ставки" style="width:100%;max-width:180px"></div>'+

      '<div class="field"><label class="fl" for="rkAuto">Автовывод на множителе</label><input id="rkAuto" type="number" inputmode="decimal" min="1.1" step="0.1" placeholder="например 2" value="'+(S.rkAuto||'')+'"></div>'+
      '<button type="button" class="btn big" id="rkBtn" data-act="rk-go">Запустить</button>'+
      '<p class="muted">Шанс долететь до ×2 около 48,5%. Теоретический возврат около 97% (преимущество казино около 3%).</p></section></div>';
  rkSize();rkDraw();drawRkHist();updateRkBtn();
}
function rkSize(){
  const c=$('#rkc'),box=$('#rkbox');if(!c||!box)return;
  rk.dpr=Math.min(2,window.devicePixelRatio||1);rk.w=box.clientWidth||300;rk.h=box.clientHeight||280;
  c.width=Math.round(rk.w*rk.dpr);c.height=Math.round(rk.h*rk.dpr);
  rk.ctx=c.getContext?c.getContext('2d'):null;
}
function rkDraw(){
  const c=rk.ctx;if(!c)return;
  const W=rk.w,H=rk.h,pl=44,pr=16,pt=16,pb=28;
  c.setTransform(rk.dpr,0,0,rk.dpr,0,0);c.clearRect(0,0,W,H);
  const tMax=Math.max(8,rk.t*1.12),mMax=Math.max(2,rk.m*1.18);
  const X=t=>pl+(W-pl-pr)*t/tMax,Y=m=>H-pb-(H-pb-pt)*(m-1)/(mMax-1);
  c.font='11px "JetBrains Mono",monospace';c.textBaseline='middle';
  [1,1.5,2,3,5,10,20,50,100,200,500].filter(v=>v<=mMax).forEach(v=>{
    const y=Y(v);c.strokeStyle='#1d2a38';c.lineWidth=1;c.beginPath();c.moveTo(pl,y);c.lineTo(W-pr,y);c.stroke();
    c.fillStyle='#8e9db0';c.textAlign='right';c.fillText(String(v).replace('.',',')+'×',pl-6,y);
  });
  const col=rk.phase==='crash'?'#ee5b5b':rk.phase==='cash'?'#35c7a6':'#e8b24a';
  const N=120,pts=[];
  for(let i=0;i<=N;i++){const t=rk.t*i/N;pts.push([X(t),Y(Math.exp(RK_K*t))]);}
  c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
  c.lineTo(pts[N][0],H-pb);c.lineTo(pts[0][0],H-pb);c.closePath();
  const g=c.createLinearGradient(0,pt,0,H-pb);g.addColorStop(0,col+'55');g.addColorStop(1,col+'05');c.fillStyle=g;c.fill();
  c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
  c.strokeStyle=col;c.lineWidth=3;c.lineJoin='round';c.stroke();
  const hx=pts[N][0],hy=pts[N][1];
  if(rk.phase==='crash'){
    c.save();c.translate(hx,hy);
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2,l=14+(i%3)*8;c.strokeStyle=i%2?'#ff8a3a':'#ee5b5b';c.lineWidth=3;c.beginPath();c.moveTo(Math.cos(a)*5,Math.sin(a)*5);c.lineTo(Math.cos(a)*l,Math.sin(a)*l);c.stroke();}
    c.restore();
  }else if(rk.phase==='cash'){
    c.fillStyle='#35c7a6';c.beginPath();c.arc(hx,hy,7,0,Math.PI*2);c.fill();
  }else{
    const dy=-(H-pb-pt)*RK_K*rk.m/(mMax-1),dx=(W-pl-pr)/tMax,ang=Math.atan2(dy,dx);
    c.save();c.translate(hx,hy);c.rotate(ang);
    c.fillStyle='#ff8a3a';c.beginPath();c.moveTo(-9,-3);c.lineTo(-20-(rk.phase==='fly'?Math.random()*8:2),0);c.lineTo(-9,3);c.closePath();c.fill();
    c.fillStyle='#ee5b5b';c.beginPath();c.moveTo(-3,-5);c.lineTo(-11,-11);c.lineTo(-9,-3);c.closePath();c.fill();
    c.beginPath();c.moveTo(-3,5);c.lineTo(-11,11);c.lineTo(-9,3);c.closePath();c.fill();
    c.fillStyle='#e9eef3';c.beginPath();c.moveTo(15,0);c.quadraticCurveTo(4,-7,-9,-5);c.lineTo(-9,5);c.quadraticCurveTo(4,7,15,0);c.fill();
    c.fillStyle='#4a7cff';c.beginPath();c.arc(3,0,2.4,0,Math.PI*2);c.fill();
    c.restore();
  }
}
function drawRkHist(){
  const h=$('#rkh');if(!h)return;
  h.innerHTML=S.rkHist.length?S.rkHist.map(v=>'<span class="'+(v<2?'h0':v<10?'h1':'h2')+'">'+mtxt(v)+'</span>').join(''):'<span class="muted" style="background:none;padding:0">Истории пока нет</span>';
}
function updateRkBtn(){
  const b=$('#rkBtn');if(!b)return;
  if(rk.phase==='fly'){b.dataset.act='rk-cash';b.disabled=false;b.textContent='Забрать · '+fmt(Math.floor(rk.bet*rk.m));}
  else{
    const bi=$('#rkBet'),bet=Math.floor(+(bi&&bi.value)||S.bet);
    b.dataset.act='rk-go';b.disabled=false;b.textContent='Запустить · '+fmt(bet);
  }
}
function rkSetBet(v){const bi=$('#rkBet');if(!bi||bi.disabled)return;bi.value=Math.max(10,Math.min(S.money,Math.floor(v)));const range=$('#rkBetRange'),value=$('#rkBetValue');if(range)range.value=Math.max(10,Math.min(+range.max,+bi.value));if(value)value.textContent=fmt(+bi.value);updateRkBtn();}
function rkStart(){
  if(state.busy||rk.phase==='fly')return;
  const bet=Math.floor(+$('#rkBet').value||0);
  if(bet<10){toast('Минимальная ставка 10 ₽');return;}
  if(bet>S.money){toast('Не хватает денег. Уменьши ставку или посмотри рекламу.');return;}
  const a=parseFloat($('#rkAuto').value);
  S.bet=bet;S.rkAuto=a>1?Math.round(a*100)/100:0;
  S.money-=bet;save();updateTop();
  rk.bet=bet;rk.crash=genCrash();rk.phase='fly';rk.t=0;rk.m=1;rk.t0=performance.now();
  $('#rkBet').disabled=true;$('#rkAuto').disabled=true;const betRange=$('#rkBetRange');if(betRange)betRange.disabled=true;
  $('#rkm').className='rkm mono';$('#rkm').textContent=mtxt(1);$('#rkmsg').textContent=S.rkAuto?'Автовывод на '+mtxt(S.rkAuto):'Жми «Забрать», пока не рвануло';
  lock();
  rk.raf=requestAnimationFrame(rkLoop);
}
function rkLoop(now){
  if(rk.phase!=='fly')return;
  const t=(now-rk.t0)/1000,m=Math.exp(RK_K*Math.max(0,t));
  const auto=S.rkAuto>1?Math.floor(S.rkAuto*100)/100:0;
  if(auto&&m>=auto&&auto<rk.crash){rkFinish('cash',auto,Math.floor(rk.bet*auto));return;}
  if(m>=rk.crash){rkFinish('crash',rk.crash,0);return;}
  rk.t=Math.max(0,t);rk.m=m;
  const rm=$('#rkm');if(rm)rm.textContent=mtxt(m);
  updateRkBtn();rkDraw();
  rk.raf=requestAnimationFrame(rkLoop);
}
function rkCash(){
  if(rk.phase!=='fly')return;
  const m=Math.exp(RK_K*(performance.now()-rk.t0)/1000);
  if(m>=rk.crash){rkFinish('crash',rk.crash,0);return;}
  const mm=Math.floor(m*100)/100;
  rkFinish('cash',mm,Math.floor(rk.bet*mm));
}
function rkFinish(kind,m,pay){
  cancelAnimationFrame(rk.raf);
  rk.phase=kind;rk.m=m;rk.t=Math.log(m)/RK_K;
  if(pay){S.money+=pay;S.stats.earned=(S.stats.earned||0)+pay;S.stats.wins=(S.stats.wins||0)+1;S.stats.rocketWins=(S.stats.rocketWins||0)+1;}
  else{S.stats.lost=(S.stats.lost||0)+rk.bet;S.stats.losses=(S.stats.losses||0)+1;}
  S.rkHist.unshift(rk.crash);S.rkHist=S.rkHist.slice(0,14);
  save();
  const bi=$('#rkBet'),ai=$('#rkAuto'),br=$('#rkBetRange');if(bi)bi.disabled=false;if(ai)ai.disabled=false;if(br)br.disabled=false;
  unlock();
  const rm=$('#rkm'),msg=$('#rkmsg');
  if(rm){rm.textContent=kind==='crash'?'Взрыв '+mtxt(m):mtxt(m);rm.className='rkm mono '+(kind==='crash'?'crash':'ok');}
  if(msg)msg.textContent=kind==='crash'?'Ракета взорвалась. Ставка '+fmt(rk.bet)+' сгорела.':'Выплата '+fmt(pay)+'. Ракета взорвалась бы на '+mtxt(rk.crash)+'.';
  rkDraw();drawRkHist();
  if(kind==='crash')sfx.lose();else sfx.win(m>=5?6:(m>=2?3:1));
}

function runMiniGame(kind){
  if(state.busy)return;
  const bet=gameBet();if(!Number.isFinite(bet)||bet<10){toast('Минимальная ставка — 10 ₽');return;}if(bet>S.money){toast('Не хватает денег для ставки.');return;}
  state.games.bet=bet;S.money-=bet;S.stats.miniGames=(S.stats.miniGames||0)+1;
  let payout=0,description='',target='';
  if(kind==='coin'){
    const ok=Math.random()<.485,side=ok?state.games.coinSide:(state.games.coinSide==='heads'?'tails':'heads');payout=ok?Math.floor(bet*2):0;description=(side==='heads'?'ОРЁЛ':'РЕШКА')+(ok?' · ПОБЕДА':' · МИМО');target='#coinResult';
  }else if(kind==='dice'){
    const chance=+(($('#diceChance')||{}).value||state.games.diceChance||50),roll=1+Math.floor(Math.random()*100);state.games.diceChance=chance;const ok=roll<=chance;payout=ok?Math.floor(bet*(.97/(chance/100))):0;description='Выпало '+roll+' · порог '+chance+(ok?' · ПОБЕДА':' · МИМО');target='#diceResult';
  }else{
    const icons=['🍒','⭐','💎','🔔','7️⃣','🪙','🧿','💠'],res=[0,1,2].map(()=>icons[Math.floor(Math.random()*icons.length)]),same=res[0]===res[1]&&res[1]===res[2],pair=res[0]===res[1]||res[0]===res[2]||res[1]===res[2];payout=same?Math.floor(bet*13):(pair?Math.floor(bet*2.33):0);description=res.join(' · ')+(same?' · ДЖЕКПОТ':pair?' · ПАРА':' · МИМО');target='#slotResult';
  }
  if(payout){S.money+=payout;S.stats.earned=(S.stats.earned||0)+payout;S.stats.miniWins=(S.stats.miniWins||0)+1;S.stats.wins=(S.stats.wins||0)+1;sfx.win(payout>=bet*3?5:2);}
  else{S.stats.lost=(S.stats.lost||0)+bet;S.stats.losses=(S.stats.losses||0)+1;sfx.lose();}
  save();updateTop();const r=$(target);if(r)r.textContent=description+(payout?' · +'+fmt(payout):' · −'+fmt(bet));
  if(payout>bet)toast('Победа! Выплата '+fmt(payout));else if(payout)toast('Ставка вернулась с небольшой прибылью');else toast('Раунд проигран. Следи за балансом.');
  const app=$('#app');if(state.tab==='games'){const results={coin:$('#coinResult')&&$('#coinResult').textContent,dice:$('#diceResult')&&$('#diceResult').textContent,slots:$('#slotResult')&&$('#slotResult').textContent};viewGames(app);if(results.coin&&$('#coinResult'))$('#coinResult').textContent=results.coin;if(results.dice&&$('#diceResult'))$('#diceResult').textContent=results.dice;if(results.slots&&$('#slotResult'))$('#slotResult').textContent=results.slots;}
}

function metricLabel(k){return LB_CATEGORIES[k]||'Заработал';}
function localProfile(){return {id:PLAYER_ID,name:S.nickname||'Игрок',balance:S.money,earned:S.stats.earned||0,ads:S.stats.ads||0,lost:S.stats.lost||0,wins:S.stats.wins||0,updatedAt:Date.now()};}
function lbRowsHTML(rows,category){
  const key=category||state.lbCategory;return rows.length?rows.map((r,i)=>'<tr class="'+(r.id===PLAYER_ID?'me':'')+'"><td class="rank">'+(i+1)+'</td><td>'+esc(r.name||'Игрок')+(r.id===PLAYER_ID?' · ты':'')+'</td><td class="mono">'+(key==='ads'||key==='wins'?fnum(+r[key]||0):(fmt(+r[key]||0)))+'</td><td class="mono">'+fmt(+r.earned||0)+'</td><td class="mono">'+fnum(+r.ads||0)+'</td><td class="mono">'+fmt(+r.lost||0)+'</td></tr>').join(''):'<tr><td colspan="6" class="muted">Пока нет результатов для этой категории.</td></tr>';
}
function drawLeaderboardRows(rows,category){const body=$('#lbRows');if(body)body.innerHTML=lbRowsHTML(rows,category);}

  const base=apiBase(),me=localProfile();

  '<div class="lb-controls">'+Object.keys(LB_CATEGORIES).map(k=>'<button class="chip'+(k===state.lbCategory?' on':'')+'" data-act="lb-category" data-k="'+k+'">'+LB_CATEGORIES[k]+'</button>').join('')+'</div>'+
  '<div class="lb-table-wrap"><table class="lb-table"><thead><tr><th>Место</th><th>Игрок</th><th>'+metricLabel(state.lbCategory)+'</th><th>Заработал</th><th>Реклама</th><th>Проиграл</th></tr></thead><tbody id="lbRows">'+lbRowsHTML([me],state.lbCategory)+'</tbody></table></div>'+
  '<div class="lb-status" id="lbStatus">'+(base?'Проверяю соединение с '+esc(base)+'…':'Локальный режим: пока отображается только твой профиль. Подключи сервер, чтобы видеть других людей.')+'</div>'+
  '<div class="foot"><span>Рейтинги учитывают игровую валюту и статистику. Реальные деньги не используются.</span></div>';
  loadLeaderboard();
}
async function loadLeaderboard(){
  const base=apiBase(),category=state.lbCategory,token=++state.lbRequest,status=$('#lbStatus');
  if(!base){drawLeaderboardRows([localProfile()],category);if(status)status.textContent='Сервер не подключён. Это локальная статистика данного устройства.';return;}
  if(status)status.textContent='Подключаюсь к серверу…';
  try{
    const resp=await fetch(base+'/api/leaderboard?category='+encodeURIComponent(category),{cache:'no-store'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();if(token!==state.lbRequest)return;
    const rows=Array.isArray(data.entries)?data.entries:[];
    if(!rows.some(r=>r.id===PLAYER_ID))rows.push(localProfile());
    rows.sort((a,b)=>(+b[category]||0)-(+a[category]||0));drawLeaderboardRows(rows.slice(0,50),category);
    if(status)status.textContent='Подключено · игроков в рейтинге: '+rows.length+'. Рейтинг общий для пользователей этого сервера.';
  }catch(e){if(token!==state.lbRequest)return;drawLeaderboardRows([localProfile()],category);if(status)status.textContent='Сервер недоступен. Проверь адрес и запуск server.js; показан твой локальный профиль.';}
}

const MILES=[[25,300],[50,800],[100,2000],[200,6000],[300,15000],[400,40000],[480,120000],[600,140000],[720,180000]];
function viewCollection(app){
  const have=SEEN.size,total=ITEMS.length,held=new Set(S.inv.map(e=>e.id)).size;
  const head='<th></th>'+FAMS.map(f=>'<th title="'+f.n+'"><svg viewBox="0 0 64 64" style="--c:#8e9db0;--l:#c3cdd8;--d:#4a5766" aria-label="'+f.n+'"><use href="#g-'+f.k+'"/></svg></th>').join('');
  const rows=TIERS.map((t,ti)=>'<tr><th>'+t.n+'</th>'+FAMS.map((f,fi)=>{
    const base=(fi*10+ti)*3;let n=0;const dots=[0,1,2].map(k=>{const on=SEEN.has(ITEMS[base+k].id);if(on)n++;return '<i class="'+(on?'on':'')+'"></i>';}).join('');
    return '<td><button type="button" class="cell" style="--rc:'+t.c+';--h:'+n+'" data-act="col-cell" data-f="'+fi+'" data-t="'+ti+'" title="'+f.n+' · '+t.n+': '+n+' из 3">'+dots+'</button></td>';
  }).join('')+'</tr>').join('');
  app.innerHTML=
    '<div class="sec-h"><h2>Коллекция</h2><span class="muted">Открыто '+have+' из '+total+' предметов. Сейчас в инвентаре '+held+' разных.</span></div>'+
    '<section class="panel"><div class="cbar"><i style="width:'+(have/total*100).toFixed(1)+'%"></i></div><div class="miles">'+
    MILES.map((m,i)=>{const done=S.claimed.includes(i),ok=!done&&have>=m[0];
      return '<div class="mile'+(ok?' ok':'')+(done?' done':'')+'"><span class="mono">'+m[0]+' предметов</span><b class="mono">+'+fmt(m[1])+'</b>'+
        (done?'<span class="muted">получено</span>':ok?'<button type="button" class="btn sm" data-act="col-claim" data-i="'+i+'">Забрать</button>':'<span class="muted">ещё '+(m[0]-have)+'</span>')+'</div>';}).join('')+'</div></section>'+
    '<h3 class="sub-h">Карта предметов</h3><p class="muted">Строки показывают редкость, столбцы тип предмета. Три точки в ячейке: сколько из трёх предметов ты уже находил. Нажми на ячейку, чтобы посмотреть.</p>'+
    '<div class="mx"><table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div><div id="colDetail" style="margin-top:12px"></div>';
}
function ghost(it){const t=TIERS[it.tier];return '<div class="it ghost" style="--rc:'+t.c+';--rl:'+t.l+'">'+svgFor(it)+'<span class="tn">'+t.n+'</span><span class="nm">Ещё не найден</span><span class="pr">—</span></div>';}

/* ===== events ===== */
const H={
  tab(t){if(state.busy)return;go(t.dataset.tab);},
  'open-case'(t){go('cases',CASES[+t.dataset.i]);},
  back(){if(state.busy)return;go('cases');},
  'qty-dec'(){setQty(S.qty-1);},
  'qty-inc'(){setQty(S.qty+1);},
  qty(t){setQty(+t.dataset.n);},
  spin(){spin();},
  skip(){state.skip=true;},
  'sell-drop'(){
    const d=state.drop;if(!d||d.sold)return;
    const sum=sellUids(new Set(d.uids));
    d.sold=true;showDrop(d);void sum;
  },
  'inv-pick'(t){const u=+t.dataset.uid;if(state.invSel.has(u))state.invSel.delete(u);else state.invSel.add(u);drawInv();},
  'inv-all'(){S.inv.forEach(e=>state.invSel.add(e.uid));drawInv();},
  'inv-none'(){state.invSel.clear();drawInv();},
  'inv-sell'(){const set=new Set(state.invSel);state.invSel.clear();sellUids(set);viewInv($('#app'));},
  'inv-sellall'(t){confirmTwice(t,'sellall','Точно продать всё?',()=>{sellUids(new Set(S.inv.map(e=>e.uid)));state.invSel.clear();viewInv($('#app'));});},
  reset(t){confirmTwice(t,'reset','Стереть весь прогресс?',()=>{S=defaults();SEEN=new Set(S.seen);state.btDrop=null;save();state.up.sel.clear();state.ct.sel.clear();state.invSel.clear();state.up.target=null;toast('Прогресс сброшен');render();});},
  'up-chance'(t){if(state.busy)return;state.up.chance=+t.dataset.c;$$('#upChips .chip').forEach(b=>b.classList.toggle('on',+b.dataset.c===state.up.chance));state.up.target=null;state.up.res=null;$('#upMsg').innerHTML='';refreshUp();},
  'up-cash'(t){if(state.busy)return;state.up.cash=t.dataset.v==='max'?S.money:Math.min(S.money,Math.max(0,+t.dataset.v||0));refreshUp();},
  'up-pick'(t){if(state.busy)return;const u=+t.dataset.uid;if(state.up.sel.has(u))state.up.sel.delete(u);else state.up.sel.add(u);state.up.res=null;$('#upMsg').innerHTML='';refreshUp();},
  'up-target'(t){if(state.busy)return;state.up.target=+t.dataset.id;state.up.res=null;$('#upMsg').innerHTML='';refreshUp();},
  'up-go'(){doUpgrade();},
  'ct-pick'(t){
    if(state.busy)return;const u=+t.dataset.uid;
    if(state.ct.sel.has(u))state.ct.sel.delete(u);
    else{if(state.ct.sel.size>=10){toast('Максимум 10 предметов');return;}state.ct.sel.add(u);}
    drawCt();
  },
  'ct-cash'(t){if(state.busy)return;state.ct.cash=t.dataset.v==='max'?S.money:Math.min(S.money,Math.max(0,+t.dataset.v||0));drawCt();},
  'ct-cheap'(t){if(state.busy)return;state.ct.sel.clear();sortedInv('price-asc').slice(0,+t.dataset.n).forEach(x=>state.ct.sel.add(x.e.uid));drawCt();},
  'ct-clear'(){if(state.busy)return;state.ct.sel.clear();drawCt();},
  'ct-go'(){doContract();},
  'coin-side'(t){state.games.coinSide=t.dataset.side;$$('[data-act=coin-side]').forEach(b=>b.classList.toggle('on',b.dataset.side===state.games.coinSide));},
  'game-coin'(){runMiniGame('coin');},
  'game-dice'(){runMiniGame('dice');},
  'game-slots'(){runMiniGame('slots');},
  'lb-save'(){const n=$('#playerName'),a=$('#apiBaseInput');if(n)S.nickname=(n.value||'Игрок').replace(/[<>\\]/g,'').trim().slice(0,22)||'Игрок';if(a){try{localStorage.setItem(API_KEY,a.value.trim().replace(/\/+$/,''));}catch(e){}}save();toast('Профиль сохранён');loadLeaderboard();},
  'lb-refresh'(){save();loadLeaderboard();},
  'lb-category'(t){state.lbCategory=t.dataset.k;viewLeaderboard($('#app'));},
  'drops-refresh'(){loadDrops(true);},
  'ad-open'(){openAd();},
  'open-daily'(){if(state.busy)return;go('cases',DAILY[dailyInfo().streak-1]);},
  'bt-rounds'(t){if(state.busy)return;state.bt.rounds=+t.dataset.n;$$('#btRounds .chip').forEach(b=>b.classList.toggle('on',+b.dataset.n===state.bt.rounds));drawBtStage();updateActions();},
  'bt-mode'(t){if(state.busy)return;state.bt.mode=t.dataset.m;$$('#btMode .chip').forEach(b=>b.classList.toggle('on',b.dataset.m===state.bt.mode));$('#btModeTxt').textContent=btModeText();},
  'bt-go'(){doBattle();},
  'sell-bt'(){const d=state.btDrop;if(!d||d.sold||!d.win)return;sellUids(new Set(d.uids));d.sold=true;showBt();},
  'rk-go'(){rkStart();},
  'rk-cash'(){rkCash();},
  'rk-bet'(t){rkSetBet(+t.dataset.v);},
  'rk-half'(){rkSetBet((+$('#rkBet').value||S.bet)/2);},
  'rk-dbl'(){rkSetBet((+$('#rkBet').value||S.bet)*2);},
  'rk-max'(){rkSetBet(S.money);},
  'col-cell'(t){
    const f=+t.dataset.f,ti=+t.dataset.t,base=(f*10+ti)*3;
    $('#colDetail').innerHTML='<h3>'+FAMS[f].n+' · '+TIERS[ti].n+'</h3><div class="igrid" style="margin-top:8px">'+[0,1,2].map(k=>{const it=ITEMS[base+k];return SEEN.has(it.id)?card(it):ghost(it);}).join('')+'</div>';
  },
  'col-claim'(t){
    const i=+t.dataset.i,m=MILES[i];
    if(!m||S.claimed.includes(i)||SEEN.size<m[0])return;
    S.claimed.push(i);S.money+=m[1];S.stats.earned=(S.stats.earned||0)+m[1];save();sfx.win(4);updateTop();toast('+'+fmt(m[1])+' за коллекцию');viewCollection($('#app'));
  },
  snd(){S.sound=!S.sound;save();updateTop();if(S.sound)sfx.coin();}
};
function setQty(n){
  if(state.busy)return;
  S.qty=Math.min(10,Math.max(1,n));save();
  const qv=$('#qv');if(qv)qv.textContent=S.qty;
  $$('#qchips .chip').forEach(b=>b.classList.toggle('on',+b.dataset.n===S.qty));
  renderStage();updateActions();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  const f=H[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-fast]')){S.fast=t.checked;save();$$('[data-fast]').forEach(x=>{x.checked=S.fast;});}
  else if(t.id==='invSort'){state.invSort=t.value;drawInv();}
  else if(t.id==='upFam'){state.up.fam=t.value;state.up.target=null;state.up.res=null;refreshUp();}
  else if(t.id==='upCash'){state.up.cash=Math.min(S.money,Math.max(0,Math.floor(+t.value||0)));refreshUp();}
  else if(t.id==='ctCash'){state.ct.cash=Math.min(S.money,Math.max(0,Math.floor(+t.value||0)));drawCt();}
  else if(t.id==='diceChance'){state.games.diceChance=+t.value;}
  else if(t.id==='playerName'||t.id==='apiBaseInput'){}
  else if(t.id==='btCase'){if(state.busy)return;state.bt.ci=+t.value;drawBtStage();updateActions();}
  else if(t.id==='btRoundsRange'){if(state.busy)return;state.bt.rounds=Math.max(1,Math.min(10,+t.value||1));drawBtStage();updateActions();}
  else if(t.id==='rkBet'){const r=$('#rkBetRange'),v=$('#rkBetValue'),n=Math.max(10,Math.min(S.money,Math.floor(+t.value||10)));t.value=n;if(r)r.value=Math.min(+r.max,n);if(v)v.textContent=fmt(n);updateRkBtn();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='rkBetRange'){
    if(rk.phase==='fly')return;
    const n=Math.max(10,Math.min(S.money,Math.floor(+t.value||10))),bi=$('#rkBet'),v=$('#rkBetValue');
    if(bi)bi.value=n;if(v)v.textContent=fmt(n);updateRkBtn();
  }else if(t.id==='rkBet'){
    const n=Math.max(10,Math.min(S.money,Math.floor(+t.value||10))),r=$('#rkBetRange'),v=$('#rkBetValue');
    if(r)r.value=Math.min(+r.max,n);if(v)v.textContent=fmt(n);updateRkBtn();
  }else if(t.id==='gameBetRange'){
    state.games.bet=Math.max(10,Math.min(S.money,Math.floor(+t.value||10)));
    const v=$('#gameBetValue');if(v)v.textContent=fmt(state.games.bet);
  }else if(t.id==='btRoundsRange'){
    if(state.busy)return;state.bt.rounds=Math.max(1,Math.min(10,+t.value||1));
    const v=$('#btRoundsValue');if(v)v.textContent=state.bt.rounds+' шт.';
    const info=$('#btInfo');if(info)info.textContent='Вход: '+state.bt.rounds+' × '+fmt(CASES[state.bt.ci].price)+' = '+fmt(btCost());updateActions();
  }else if(t.id==='upCashRange'){
    if(state.busy)return;state.up.cash=Math.min(S.money,Math.max(0,Math.floor(+t.value||0)));
    const v=$('#upCash');if(v)v.value=state.up.cash;refreshUp();
  }else if(t.id==='ctCashRange'){
    if(state.busy)return;state.ct.cash=Math.min(S.money,Math.max(0,Math.floor(+t.value||0)));
    const v=$('#ctCash');if(v)v.value=state.ct.cash;drawCt();
  }
});
window.addEventListener('resize',()=>{if(state.tab==='rocket'&&!state.curCase&&$('#rkc')){rkSize();rkDraw();}});

render();
if(yandexBuild){yandexInitPromise.then(sdk=>{if(!sdk)return;try{sdk.features.LoadingAPI?.ready();sdk.features.GameplayAPI?.start();}catch(e){}updateAdAccess();});}
queueOnlineSync();
setInterval(dailyTick,1000);
setInterval(()=>{if(!state.curCase&&state.tab==='drops')loadDrops(false);refreshDropTicker();},5000);
refreshDropTicker();
})();
</script>

</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox=%220 0 32 32%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cdefs%3E%3ClinearGradient id=%22lgb%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%233b2f86%22/%3E%3Cstop offset=%221%22 stop-color=%22%2314183a%22/%3E%3C/linearGradient%3E%3CradialGradient id=%22lgg%22 cx=%2250%25%22 cy=%2250%25%22 r=%2250%25%22%3E%3Cstop offset=%220%22 stop-color=%22%238b7bff%22 stop-opacity=%22.7%22/%3E%3Cstop offset=%221%22 stop-color=%22%238b7bff%22 stop-opacity=%220%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22url(%23lgb)%22/%3E%3Ccircle cx=%2216%22 cy=%2215%22 r=%2213%22 fill=%22url(%23lgg)%22/%3E%3Cpath d=%22M16 8 26 13 16 18 6 13Z%22 fill=%22%23ffe9a6%22/%3E%3Cpath d=%22M6 13 16 18v10L6 23Z%22 fill=%22%23ffc247%22/%3E%3Cpath d=%22M26 13 16 18v10l10-5Z%22 fill=%22%23b5822b%22/%3E%3Cpath d=%22M16 11l4 2-4 2-4-2Z%22 fill=%22%232a1a00%22/%3E%3Cpath d=%22M16 12l2 1-2 1-2-1Z%22 fill=%22%237cf0d2%22/%3E%3Cpath d=%22M16 1.5l1.2 2.6 2.6 1.2-2.6 1.2L16 9.1l-1.2-2.6-2.6-1.2 2.6-1.2Z%22 fill=%22%23fff6c9%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кейс Арена — открывай кейсы с друзьями</title>
<meta name="description" content="Бесплатная игра: кейсы, апгрейды, контракты, ракета и общий рейтинг игроков. Игровая валюта, без реальных денег.">
<meta name="theme-color" content="#090b13">
<meta property="og:title" content="Кейс Арена">
<meta property="og:description" content="Открывай кейсы, делай апгрейды и попади в таблицу лидеров. Игровая валюта, без реальных денег.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Onest:wght@400;600;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky bar (balance, ad, sound) over a four-tab strip; one workbench at a time.
   Opening a case puts the reels first and the full drop table below them.
   Palette: gunmetal ground, brass for money and the main action, teal for wins, red for losses; item colors come from rarity tiers.
   Type: Russo One for headings and buttons, Manrope for text, JetBrains Mono for every price. */
:root{
  --bg:#0e141a;--panel:#151d26;--panel2:#1b2632;--line:#273443;--line2:#3a4b61;
  --fg:#e9eef3;--muted:#8e9db0;--brass:#e8b24a;--brass2:#f6d283;--ink:#221704;
  --win:#35c7a6;--lose:#ee5b5b;
  --display:"Russo One","Arial Black",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;min-height:100%;padding-block:0 40px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.02em;text-wrap:balance}
h2{font-size:22px}
h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;min-height:36px;padding:0 8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}

/* top bar */
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(14,20,26,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:18px;letter-spacing:.05em;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.bank{display:flex;align-items:center;gap:8px;min-width:0}
.bal{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.bal .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bal b{font-size:16px;color:var(--brass2);white-space:nowrap}
.bal.up{animation:flashUp .8s}.bal.down{animation:flashDown .8s}
@keyframes flashUp{0%{background:rgba(53,199,166,.38)}100%{background:var(--panel)}}
@keyframes flashDown{0%{background:rgba(238,91,91,.34)}100%{background:var(--panel)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:8px;background:var(--brass);color:var(--ink);font-family:var(--display);font-size:14px;letter-spacing:.03em;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.big{min-height:50px;font-size:16px;padding:0 24px}
.btn.danger{background:var(--lose);color:#fff}
.btn.ad{background:var(--panel2);color:var(--brass2);border:1px solid var(--line2);padding:0 12px}
.btn.ad svg{width:14px;height:14px}
.btn.ad.pulse{animation:pulse 1.4s infinite;border-color:var(--brass)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,178,74,.6)}70%{box-shadow:0 0 0 10px rgba(232,178,74,0)}100%{box-shadow:0 0 0 0 rgba(232,178,74,0)}}
.icon{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
.icon svg{width:20px;height:20px}
.icon.off{color:var(--muted)}
@media(max-width:560px){.brand span{display:none}.bank{flex:1;justify-content:flex-end}}
.tabs{display:flex;gap:4px;padding-block:0 8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-height:40px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--panel2);color:var(--brass2);box-shadow:inset 0 -2px 0 var(--brass)}
.tabs .n{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:9px;background:var(--line);color:var(--fg)}
body.busy .tabs button:not(.on){opacity:.45;pointer-events:none}
#app{padding-block:18px 0}

/* common blocks */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.note{padding:10px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);margin-bottom:14px}
.note.warn{border-color:var(--brass)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{padding:18px 6px;text-align:center;color:var(--muted)}
.foot{margin-top:26px;color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* case list */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ccard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:center;min-width:0;transition:transform .15s,border-color .15s,background .15s}
.ccard:hover{transform:translateY(-3px);border-color:var(--a);background:var(--panel2)}
.ccard svg{width:100%;max-width:130px;height:auto}
.ccard .cn{font-family:var(--display);font-size:15px;margin-top:2px}
.ccard .cp{font-family:var(--mono);font-weight:700;color:var(--brass2);font-size:14px}
.ccard .ct{font-size:11px;color:var(--muted)}

/* items */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.it{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 7px;border-radius:7px;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 20%,var(--panel)) 0%,var(--panel) 85%);border:1px solid color-mix(in srgb,var(--rc) 35%,var(--line));text-align:center;min-width:0;color:var(--fg)}
.it svg{width:54px;height:54px;filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--rc) 45%,transparent))}
.it .tn{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rl);font-weight:800}
.it .nm{font-size:11.5px;font-weight:600;line-height:1.2;min-height:2.4em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%}
.it .pr{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--brass2)}
.it .bd{position:absolute;top:4px;left:5px;font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.45);color:var(--win)}
.it.pick{cursor:pointer;transition:transform .12s,border-color .12s}
.it.pick:hover{transform:translateY(-2px);border-color:var(--rc)}
.it.pick.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.it.pick.sel::after{content:"✓";position:absolute;top:2px;right:6px;color:var(--brass2);font-weight:800}
.it.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* case view */
.crumb{margin-bottom:10px}
.chead{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.cprice{font-size:20px;color:var(--brass2);font-weight:700}
.stage{display:flex;flex-direction:column;gap:8px;margin-block:14px}
.reel{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#0a0f14;height:156px}
.reel.sm{height:108px}
.strip{position:relative;display:flex;gap:6px;padding:8px;height:100%;will-change:transform}
.rc{flex:0 0 auto;width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:7px;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 24%,#0e151c),#0e151c 85%);border:1px solid color-mix(in srgb,var(--rc) 40%,#1d2a38);padding:6px 4px;min-width:0}
.rc svg{width:62px;height:62px;filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--rc) 40%,transparent))}
.rc .rn{font-size:10.5px;font-weight:600;text-align:center;line-height:1.15;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rc .rp{font-size:11px;color:var(--brass2);font-weight:700}
.reel.sm .rc{width:92px}
.reel.sm .rc svg{width:44px;height:44px}
.reel.sm .rn{display:none}
.reel::before{content:"";position:absolute;z-index:2;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--brass);box-shadow:0 0 14px 2px rgba(232,178,74,.55)}
.reel::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#0a0f14 0%,transparent 14%,transparent 86%,#0a0f14 100%)}
.rc.dim{opacity:.3;transition:opacity .4s}
.rc.win{box-shadow:0 0 0 2px var(--rc),0 0 22px color-mix(in srgb,var(--rc) 60%,transparent)}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.qty{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.qty button{width:40px;height:40px;border:0;background:var(--panel2);font-size:20px;line-height:1}
.qty output{min-width:44px;text-align:center;font-family:var(--mono);font-weight:700;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;min-width:46px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:transparent;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--fg)}
.chip.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--brass)}
.ctl .btn.big{margin-left:auto}
@media(max-width:560px){.ctl .btn.big{margin-left:0;flex:1 1 100%}}
.drop{margin-top:14px;padding:14px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;gap:12px}
.drop.flash{animation:glow 1.6s}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(232,178,74,.8)}100%{box-shadow:0 0 0 24px rgba(232,178,74,0)}}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dh .big{font-size:24px;font-weight:700;color:var(--brass2)}
.delta{font-size:18px;font-weight:700}
.delta.pos{color:var(--win)}.delta.neg{color:var(--lose)}
.band{margin-top:16px}
.bh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bh i{width:10px;height:10px;border-radius:50%;flex:none}
.bh b{font-family:var(--display);font-weight:400;font-size:15px}
.bh .mono{color:var(--brass2);font-weight:700}
.sub-h{margin:22px 0 2px}

/* upgrade + contract layout */
.two{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:800px){.two{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
.wheelp{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.wheelbox{position:relative;width:min(100%,300px);aspect-ratio:1;margin:0 auto}
.wheelbox svg.w{position:absolute;inset:0;width:100%;height:100%}
.ptr{position:absolute;inset:0}
.ptr svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.wtxt{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:2px;padding:0 24%}
.wtxt b{font-size:30px;line-height:1.1}
.wtxt span{font-size:11px;line-height:1.25;max-height:3.8em;overflow:hidden}
.wtxt b.res-win{color:var(--win);font-family:var(--display);font-weight:400;font-size:24px}
.wtxt b.res-lose{color:var(--lose);font-family:var(--display);font-weight:400;font-size:24px}.wtxt b.res-jackpot{color:var(--brass2);font-family:var(--display);font-weight:400;font-size:22px}
.chips.wide .chip{flex:1}
.pickh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pickh b{color:var(--brass2)}
.umsg{min-height:0}
.machine{display:flex;flex-direction:column;gap:14px}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.slot{aspect-ratio:1;border:1px dashed var(--line2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.slot.f{border-style:solid;border-color:color-mix(in srgb,var(--rc) 55%,var(--line));background:color-mix(in srgb,var(--rc) 14%,var(--panel))}
.slot svg{width:60%;height:auto}
.slot .mono{font-size:10px;color:var(--brass2);font-weight:700}
.slots.shake .slot.f{animation:shake .18s infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-2deg)}50%{transform:translate(2px,-1px) rotate(2deg)}75%{transform:translate(-1px,-2px) rotate(-1deg)}100%{transform:translate(0,0) rotate(0)}}
.mrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mrow b{color:var(--brass2)}
.obar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.obar i{display:block;min-width:3px}
.olist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.olist li{display:grid;grid-template-columns:10px minmax(0,1fr) auto 44px;gap:8px;align-items:center}
.olist li i{width:10px;height:10px;border-radius:50%}
.olist li b{text-align:right;font-size:13px}
.olist li span.mono{font-size:12px;color:var(--muted)}
@media(max-width:560px){.olist li{grid-template-columns:10px minmax(0,1fr) 44px}.olist li span.mono{display:none}}
@media(max-width:420px){.tabs button{font-size:12.5px;padding:0 11px}}
.cres{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2)}
.cres .it{width:130px;flex:none}
.cres .q{width:130px;height:150px;display:grid;place-items:center;font-family:var(--display);font-size:56px;color:var(--brass2);border:1px dashed var(--brass);border-radius:8px;animation:pulseQ 1s infinite}
@keyframes pulseQ{50%{opacity:.45}}
.verdict{font-family:var(--display);font-size:22px}
.verdict.v0{color:var(--lose)}.verdict.v1{color:var(--muted)}.verdict.v2{color:var(--win)}.verdict.v3{color:var(--brass2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.stat{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.stat span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--mono);color:var(--brass2);font-size:15px}

/* live drop feed */
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--win);box-shadow:0 0 8px rgba(53,199,166,.7);flex:none;animation:livePulse 1.8s infinite}
@keyframes livePulse{50%{opacity:.45;box-shadow:0 0 2px rgba(53,199,166,.3)}}
.dropfeed-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dropfeed-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.dropfeed-list{display:flex;flex-direction:column;gap:7px}
.df-item{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:linear-gradient(100deg,color-mix(in srgb,var(--dfc) 10%,var(--panel)),var(--panel) 55%);min-width:0;transition:border-color .2s,background .2s}
.df-item.fresh{animation:dfFresh 1.2s ease-out;border-color:var(--dfc)}
@keyframes dfFresh{0%{background:color-mix(in srgb,var(--dfc) 30%,var(--panel));transform:translateY(-3px)}100%{transform:translateY(0)}}
.df-swatch{height:43px;border-radius:5px;background:var(--dfc);box-shadow:0 0 12px color-mix(in srgb,var(--dfc) 35%,transparent)}
.df-info{min-width:0;display:flex;flex-direction:column;gap:4px}
.df-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.df-name{font-size:13px;overflow-wrap:anywhere}
.df-tier{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;color:var(--dfc);background:color-mix(in srgb,var(--dfc) 14%,transparent);border:1px solid color-mix(in srgb,var(--dfc) 32%,transparent);white-space:nowrap}
.df-meta{display:flex;gap:5px 9px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.df-meta span{overflow-wrap:anywhere}
.df-price{color:var(--brass2);font:700 13px var(--mono);white-space:nowrap;text-align:right}
 .dropfeed-empty{padding:30px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:9px}

html{background:var(--bg)}
body{font-size:14.5px;background:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 460px at 85% -8%,rgba(139,123,255,.15),transparent 62%),
  radial-gradient(760px 420px at -5% 0%,rgba(255,194,71,.06),transparent 60%)}
h1,h2{font-family:var(--display);font-weight:600;letter-spacing:-.01em}
h2{font-size:21px}
h3{font-family:var(--body);font-size:14px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--fg)}
.fl,.stat span{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.sec-h{align-items:flex-end}
.sec-h .muted{font-size:13px}

/* top bar */
.stick{background:rgba(9,11,19,.8);border-bottom:1px solid rgba(139,123,255,.16)}
.brand{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em;gap:10px}
.brand svg{width:34px;height:34px}
.bal{flex-direction:row;align-items:center;gap:8px;padding:5px 12px 5px 8px;border-radius:999px;border:1px solid rgba(255,194,71,.28);background:linear-gradient(180deg,rgba(255,194,71,.1),rgba(255,194,71,.03))}
.bal .coin{width:22px;height:22px;color:var(--brass);flex:none}
.bal .bt{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;gap:1px}
.ti{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bal .lbl{font-size:10px;letter-spacing:0;text-transform:none;color:var(--muted)}
.bal b{font-size:15px;color:var(--brass2)}
.btn{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:0;border-radius:12px;min-height:42px;
  background:linear-gradient(180deg,#ffd46e,#ffb42d);color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 20px -10px rgba(255,180,45,.75)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2);box-shadow:none}
.btn.ghost:hover{background:var(--panel2);border-color:var(--iris)}
.btn.sm{min-height:36px;font-size:11.5px;padding:0 13px}
.btn.big{min-height:52px;font-size:14px;border-radius:14px;padding:0 26px}
.btn.danger{background:linear-gradient(180deg,#ff7a8c,#ff4d66);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ad{background:rgba(139,123,255,.14);color:var(--iris2);border:1px solid rgba(139,123,255,.45);box-shadow:none;font-size:11.5px}
.btn.ad.pulse{border-color:var(--iris);animation:pulseV 1.6s infinite}
@keyframes pulseV{0%{box-shadow:0 0 0 0 rgba(139,123,255,.55)}70%{box-shadow:0 0 0 10px rgba(139,123,255,0)}100%{box-shadow:0 0 0 0 rgba(139,123,255,0)}}
.btn:disabled{opacity:.4}
.icon{border-radius:12px;background:var(--panel);border-color:var(--line2)}
.chip{border-radius:10px;font-family:var(--body);font-weight:700}
.chip.on{background:linear-gradient(180deg,#ffd46e,#ffb42d);color:var(--ink);border-color:transparent}

/* nav: icons on top bar (wide), bottom bar (phone) */
.tabs button{border-radius:12px;font-weight:700;font-size:13px;gap:6px;color:var(--muted)}
@media(min-width:900px){html body .tabs{flex-wrap:nowrap;gap:2px}html body .tabs button{flex:1 1 auto;padding:0 8px;font-size:12.5px}}
.tabs button .ti,.bnav .ti,.sheet .ti{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:linear-gradient(180deg,rgba(139,123,255,.26),rgba(139,123,255,.1));color:#fff;box-shadow:inset 0 0 0 1px rgba(139,123,255,.55)}
.tabs .n{background:rgba(255,255,255,.1)}
.live-dot{background:var(--win)}
.bnav{display:none}
.sheet-bg{position:fixed;inset:0;z-index:55;background:rgba(5,7,12,.6);display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:56;background:var(--panel);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;padding:14px 14px calc(88px + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet.open{display:grid;animation:sheetUp .22s ease-out}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--fg);font-weight:700;font-size:12.5px}
.sheet button .ti{width:24px;height:24px;color:var(--iris2)}
.sheet button.on{border-color:var(--iris);color:#fff}
@media(max-width:760px){
  .tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:57;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(18,24,40,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:20px;padding:6px;box-shadow:0 14px 40px -10px rgba(0,0,0,.7)}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-weight:700;font-size:10.5px}
  .bnav button.on{background:rgba(139,123,255,.2);color:#fff}
  body.busy .bnav button:not(.on){opacity:.4;pointer-events:none}
  html body{padding-bottom:96px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}

/* live strip (moved to top) */
html body .tkr{max-width:100%;margin:12px auto 0}
html body .drop-ticker{position:relative;left:auto;right:auto;bottom:auto;height:56px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:none;backdrop-filter:none}
html body .drop-ticker-label{padding:0 14px;border-right:1px solid var(--line2);background:linear-gradient(135deg,rgba(139,123,255,.2),transparent)}
html body .drop-ticker-label b{font-size:12px;letter-spacing:0;text-transform:none;color:var(--fg);display:flex;align-items:center;gap:7px}
html body .drop-ticker-label span{display:none}
html body .ticker-pause{display:none}
html body .dt-item{min-width:190px;padding:5px 9px;border-radius:10px}
html body .dt-art{width:34px;height:34px;font-size:0}
html body .dt-art svg{width:24px;height:24px}
html body .dt-item-name{font-size:12px}
html body .dt-player{font-size:10.5px}
html body .dt-price{font-size:11.5px}
.drop-ticker-label .pause{margin-left:4px;background:none;border:0;color:var(--muted);padding:0;font-size:11px;text-align:left;cursor:pointer}

/* cases */
.cfilter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1 1 220px;min-width:0}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;margin-top:-9px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search input{width:100%;min-height:42px;padding:0 12px 0 38px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);color:var(--fg);font:inherit}
.search input:focus{border-color:var(--iris);outline:0}
.cfilter .chips{flex:0 1 auto}
.cfilter select{border-radius:12px;min-height:42px;background:var(--panel)}
.cgrid{gap:12px}
.ccard{position:relative;border-radius:18px;padding:14px 10px 12px;gap:3px;border:1px solid var(--line);overflow:hidden;isolation:isolate;
  background:radial-gradient(120px 100px at 50% 34%,color-mix(in srgb,var(--a) 30%,transparent),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel))}
.ccard::after{content:"";position:absolute;left:12%;right:12%;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--a),transparent);opacity:.9}
.ccard:hover{transform:translateY(-4px);border-color:var(--a);background:radial-gradient(130px 110px at 50% 34%,color-mix(in srgb,var(--a) 42%,transparent),transparent 72%),linear-gradient(180deg,var(--panel2),var(--panel))}
.ccard svg{filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.ccard .cn{font-family:var(--body);font-weight:800;font-size:14.5px;line-height:1.2;min-height:2.4em;display:flex;align-items:center}
.ccard .cp{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 6px;border-radius:999px;background:rgba(255,194,71,.1);border:1px solid rgba(255,194,71,.25)}
.ccard .cp svg{width:15px;height:15px;color:var(--brass);filter:none}
.ccard .ct{font-size:11.5px}
.pr-ic{display:inline-block;width:.95em;height:.95em;vertical-align:-.12em;margin-right:.25em;fill:none;stroke:currentColor;stroke-width:2}

/* items */
.it{border-radius:14px;padding:9px 6px 8px;
  background:radial-gradient(90px 70px at 50% 22%,color-mix(in srgb,var(--rc) 26%,transparent),transparent 72%),linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid color-mix(in srgb,var(--rc) 38%,var(--line))}
.it .tn{font-size:10px;font-weight:700;letter-spacing:0;text-transform:none}
.it .pr{display:inline-block;padding:1px 8px;border-radius:999px;background:rgba(0,0,0,.28);font-size:11.5px}
.it.pick.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass),0 0 24px -4px rgba(255,194,71,.5)}
.it .bd{background:rgba(63,224,181,.16);color:var(--win);border-radius:6px}

/* reel */
.reel{border-radius:16px;border:1px solid var(--line2);background:
  linear-gradient(180deg,rgba(139,123,255,.08),transparent 40%),#070910;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.reel::before{width:22px;margin-left:-11px;background:var(--brass);box-shadow:none;filter:drop-shadow(0 0 8px rgba(255,194,71,.7));
  clip-path:polygon(0 0,22px 0,12px 14px,12px calc(100% - 14px),22px 100%,0 100%,10px calc(100% - 14px),10px 14px)}
.reel::after{background:linear-gradient(90deg,#070910 0%,transparent 16%,transparent 84%,#070910 100%)}
.rc{border-radius:12px;background:radial-gradient(70px 60px at 50% 30%,color-mix(in srgb,var(--rc) 28%,transparent),transparent 75%),#0d1220;border:1px solid color-mix(in srgb,var(--rc) 42%,#1a2338)}
.rc.win{box-shadow:0 0 0 2px var(--rc),0 0 30px color-mix(in srgb,var(--rc) 65%,transparent)}
.ctl{border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.qty{border-radius:12px}
.drop{border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.bh b{font-family:var(--body);font-weight:800}
.panel{border-radius:16px;background:linear-gradient(180deg,rgba(24,32,51,.7),var(--panel))}
.note{border-radius:14px}
.stat{border-radius:12px}
.stat b{color:var(--brass2)}
.daily{border-radius:18px;border-color:rgba(255,194,71,.4);background:radial-gradient(420px 200px at 0% 50%,rgba(255,194,71,.16),transparent 70%),var(--panel)}
.dtxt h3{color:var(--brass2);font-family:var(--display);font-weight:600;font-size:15px}
.pips i.on{background:var(--brass)}

/* games */
.gamecard{border-radius:18px;background:radial-gradient(260px 160px at 100% 0%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%),var(--panel)}
.gameicon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 18%,var(--panel2));color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.gameicon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gamecard h3{font-family:var(--display);font-weight:600;font-size:15px}
.game-result{border-radius:12px;background:#080b14;font-size:15px}
.game-result svg.sym{width:34px;height:34px}
.game-result.roll svg.sym{animation:rollSym .12s linear infinite}
@keyframes rollSym{50%{transform:translateY(-4px)}}
.achievement{border-radius:14px}
.achievement .aicon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);color:var(--muted);border:1px solid var(--line2)}
.achievement .aicon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.achievement.done .aicon{background:rgba(255,194,71,.14);color:var(--brass);border-color:rgba(255,194,71,.5)}
.agrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.lb-table-wrap{border-radius:16px}
.lb-table th{text-transform:none;letter-spacing:0;font-size:12px}
.lb-table tr.me td{background:rgba(139,123,255,.12);color:#fff}
.rank{color:var(--brass2)}
.lb-medal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-family:var(--display);font-size:12px;color:#1b1200}
.lb-medal.m1{background:linear-gradient(#ffe08a,#ffb42d)}.lb-medal.m2{background:linear-gradient(#e8edf7,#a9b4cc)}.lb-medal.m3{background:linear-gradient(#f0b78c,#c27a45)}
.rkbox{border-radius:16px;background:radial-gradient(500px 240px at 50% 100%,rgba(139,123,255,.14),transparent 70%),#070910}
.cell{border-radius:6px}
.wtxt b.res-win,.wtxt b.res-lose,.wtxt b.res-jackpot{font-family:var(--display);font-weight:600}
.verdict{font-family:var(--display);font-weight:600}

/* modal + toast */
.adcard{border-radius:20px}
.toast{border-radius:12px;background:#1d2640;border-color:var(--line2)}
.adbody{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--ac) 55%,#0b0f1c),#0b0f1c 75%)}
.stk{background:linear-gradient(180deg,#ffd46e,#ffb42d)}
.foot{font-size:12.5px}
.err{padding:14px;border:1px dashed var(--lose);border-radius:12px;color:#ffb3bd;margin-bottom:12px}
@media(max-width:560px){h2{font-size:18px}.brand span{display:inline;font-size:14px}.bal b{font-size:13px}.bal .lbl{display:none}.bank{gap:5px}}
@media(max-width:400px){.brand span{display:none}}

@keyframes dropTickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.drop-ticker-track.still{animation:none!important}

.brand{flex:none}
.bank{min-width:0}
#adLbl{white-space:nowrap}
@media(max-width:560px){.btn.ad{padding:0 9px}#adLbl{max-width:96px;overflow:hidden;text-overflow:ellipsis}}

/* ===== performance ===== */
html body .stick{backdrop-filter:none;-webkit-backdrop-filter:none;background:#0b0e18}
html body .bnav{backdrop-filter:none;-webkit-backdrop-filter:none;background:#121828}
html body .drop-ticker{contain:layout paint}
.drop-ticker-track{will-change:transform}
html body .ccard svg,html body .it svg,html body .rc svg{filter:none}
.strip{will-change:auto}
.reel .rc{contain:layout paint}
.ccard{content-visibility:auto;contain-intrinsic-size:auto 230px}
.band{content-visibility:auto;contain-intrinsic-size:auto 420px}
.agrid .achievement,.dropfeed-list .df-item{content-visibility:auto;contain-intrinsic-size:auto 80px}
.btn.ad.pulse{animation:none;box-shadow:0 0 0 3px rgba(139,123,255,.35)}
.live-dot{animation:none;box-shadow:none}
.pips i.now{animation:none}
.ccard,.it.pick,.btn{transition:transform .12s,border-color .12s}
@media(min-width:900px){html body .tabs{overflow-x:auto;scrollbar-width:none}html body .tabs::-webkit-scrollbar{display:none}}
@media(min-width:900px) and (max-width:1500px){html body .tabs button .ti{display:none}}

/* ===== slots page ===== */
.slot-wrap{display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.slot-wrap{grid-template-columns:minmax(0,1fr)}}
.slside{display:flex;flex-direction:column;gap:14px}
.cabinet{--cell:104px;position:relative;padding:18px 18px 20px;border-radius:26px;border:1px solid rgba(255,194,71,.35);
  background:radial-gradient(500px 260px at 50% -10%,rgba(139,123,255,.28),transparent 70%),linear-gradient(180deg,#171d33,#0e1222);
  box-shadow:0 30px 60px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08);transition:box-shadow .3s,border-color .3s}
@media(max-width:560px){.cabinet{--cell:82px;padding:12px 10px 16px;border-radius:20px}}
.cabinet.win{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),0 0 40px -6px rgba(255,194,71,.55)}
.cabinet.mega{border-color:#ffe08a;box-shadow:0 0 0 2px #ffe08a,0 0 70px 0 rgba(255,194,71,.8);animation:megaPulse .7s ease-in-out 3}
@keyframes megaPulse{50%{box-shadow:0 0 0 2px #fff3c4,0 0 100px 8px rgba(255,194,71,.95)}}
.cabinet.tease{border-color:#ff8a6a;animation:teaseGlow .45s ease-in-out infinite alternate}
@keyframes teaseGlow{from{box-shadow:0 0 0 1px rgba(255,138,106,.3),0 0 20px -4px rgba(255,138,106,.3)}to{box-shadow:0 0 0 2px #ff8a6a,0 0 56px 2px rgba(255,138,106,.7)}}
.bulbs{display:flex;justify-content:space-between;padding:0 6px 12px}
.bulbs i{width:8px;height:8px;border-radius:50%;background:#3a3350;box-shadow:inset 0 1px 1px rgba(255,255,255,.2)}
.cabinet.win .bulbs i,.cabinet.mega .bulbs i{background:#ffd46e;box-shadow:0 0 8px #ffb42d}
.cabinet.tease .bulbs i{background:#ff8a6a;box-shadow:0 0 8px #ff6a4a}
.cabinet.mega .bulbs i:nth-child(odd){animation:bulb .3s steps(2) infinite}
@keyframes bulb{50%{opacity:.25}}
.slmsg{min-height:28px;text-align:center;font-weight:700;font-size:14px;color:var(--muted);margin-bottom:10px;transition:color .2s}
.slmsg.hot{color:#ffb08f;font-family:var(--display);font-size:15px}
.slmsg.ok{color:var(--brass2);font-family:var(--display);font-size:15px}
.reels{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px;border-radius:20px;background:#05070e;box-shadow:inset 0 4px 18px #000,0 0 0 1px #2a3350}
.sreel{position:relative;height:calc(var(--cell)*3);overflow:hidden;border-radius:12px;background:linear-gradient(180deg,#0f1426,#161d36 50%,#0f1426);contain:paint}
.sreel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,4,9,.85),transparent 30%,transparent 70%,rgba(2,4,9,.85))}
.sreel.landed{animation:landed .26s ease-out}
@keyframes landed{40%{transform:translateY(2px)}}
.sstrip{position:absolute;left:0;right:0;top:0}
.cell{height:var(--cell);display:grid;place-items:center;position:relative}
.cell .sym{width:64%;height:64%}
.cell.hit::before{content:"";position:absolute;inset:6px;border-radius:14px;background:radial-gradient(circle,rgba(255,212,110,.4),rgba(255,212,110,.08) 70%);box-shadow:0 0 0 2px #ffd46e,0 0 24px rgba(255,194,71,.7);z-index:1}
.cell.hit .sym{position:relative;z-index:2;animation:hitPop .5s ease-out 2}
@keyframes hitPop{50%{transform:scale(1.22) rotate(-4deg)}}
.payline{position:absolute;left:0;right:0;top:50%;height:0;pointer-events:none;z-index:3}
.payline::before{content:"";position:absolute;left:8px;right:8px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,194,71,.55) 12%,rgba(255,194,71,.55) 88%,transparent)}
.payline::after{content:"";position:absolute;left:-1px;top:-8px;width:0;height:0;border:8px solid transparent;border-left:12px solid #ffc247;border-right:0;filter:drop-shadow(0 0 6px rgba(255,194,71,.8))}
.fx{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:5}
.fx i{position:absolute;left:-4px;top:-4px;width:8px;height:12px;border-radius:2px;background:var(--c);opacity:0;animation:fly 1.5s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 90px)) rotate(var(--r))}}
.slwin{min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin:10px 0 6px;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .25s,transform .25s}
.slwin.show{opacity:1;transform:none}
.slwin .wn{font-family:var(--display);font-weight:700;font-size:34px;color:var(--brass2);text-shadow:0 0 24px rgba(255,194,71,.5)}
.slwin .wl{font-size:13px;color:var(--muted);font-weight:600}
@media(max-width:560px){.slwin .wn{font-size:28px}}
.slctl{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.slbet{display:flex;align-items:stretch;justify-content:center;gap:10px}
.slbet .stp{width:52px;border:1px solid var(--line2);border-radius:14px;background:var(--panel2);color:var(--fg);font-size:24px;line-height:1}
.slbet .stp:disabled{opacity:.35}
.slbet .bv{flex:1;max-width:240px;display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:14px;background:#080b16;border:1px solid var(--line)}
.slbet .bv b{font-size:22px;color:var(--brass2)}
.slctl .chips{justify-content:center}
.slctl .chip:disabled{opacity:.4}
.slctl .spin{width:100%;min-height:60px;font-size:16px;border-radius:18px}
.sl2{justify-content:space-between}
.sl2 .hint{font-size:12px}
@media(max-width:560px){.sl2 .hint{display:none}}
.paylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.paylist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:6px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.paylist .pts{display:flex;grid-row:1/3}
.paylist .pts .sym{width:30px;height:30px}
.paylist .pts em{display:grid;place-items:center;width:30px;font-style:normal;color:var(--muted);font-weight:800}
.paylist .pn{font-weight:700;font-size:13px}
.paylist b{color:var(--brass2);text-align:right}
.paylist i{grid-column:2/4;font-style:normal;font-size:11.5px;color:var(--muted)}
.paylist .pairrow{border-style:dashed}

/* ===== rpg ===== */
.rstage{position:relative;display:flex;justify-content:space-between;align-items:flex-end;height:170px;margin:14px 0 4px;padding:0 8%;border-radius:16px;background:radial-gradient(260px 120px at 50% 100%,rgba(139,123,255,.18),transparent 70%),linear-gradient(180deg,#0b0f1d,#121832);overflow:hidden}
.rstage.shake{animation:stShake .26s}
@keyframes stShake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.fig{width:96px;height:116px;transition:opacity .6s,transform .6s}.fig svg{width:100%;height:100%;display:block}
.fig.boss{width:124px;height:150px}
.fig.lunge-r{animation:lungeR .42s ease-in-out}.fig.lunge-l{animation:lungeL .42s ease-in-out}
@keyframes lungeR{40%{transform:translateX(70px) rotate(6deg)}}
@keyframes lungeL{40%{transform:translateX(-70px) rotate(-6deg)}}
.fig.hurt{animation:hurt .38s}
@keyframes hurt{20%{opacity:.35;transform:translateX(-5px)}50%{opacity:1;transform:translateX(4px)}}
.fig.enter{animation:enterF .7s ease-out}
@keyframes enterF{from{opacity:0;transform:translateX(40px)}}
.fig.dead{opacity:0;transform:translateY(16px) scale(.85)}
.dmg{position:absolute;inset:0;pointer-events:none}
.dp{position:absolute;top:34px;font-family:var(--display);font-size:24px;font-weight:700;color:#ffe08a;text-shadow:0 2px 6px #000;animation:dpUp 1.1s ease-out forwards}
.dp.den{right:14%}.dp.dhero{left:14%}.dp.bad{color:#ff7a6a}
@keyframes dpUp{from{opacity:1;transform:translateY(14px) scale(.8)}20%{transform:translateY(0) scale(1.25)}to{opacity:0;transform:translateY(-34px) scale(1)}}
@media(max-width:560px){.rstage{height:140px}.fig{width:76px;height:92px}.fig.boss{width:96px;height:118px}}
@media(prefers-reduced-motion:reduce){.fig.lunge-r,.fig.lunge-l,.rstage.shake{animation:none}}
.rpg-wrap{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.rpg-wrap{grid-template-columns:minmax(0,1fr)}}
.rpg-l,.rpg-r{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero .hh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.xpb{height:8px;border-radius:6px;background:#0b0f1d;overflow:hidden;margin-top:8px}
.xpb i{display:block;height:100%;background:linear-gradient(90deg,#8b7bff,#3fe0b5);border-radius:6px}
.rslots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rslot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:16px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);text-align:center;min-height:150px;--rc:#3a4466}
.rslot.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.rslot .rsn{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rslot .rsi svg{width:54px;height:54px}
.rslot .rnm{font-size:12.5px;font-weight:700;line-height:1.2}
.rslot .rbn{font-size:11.5px;color:var(--brass2)}
.rslot .rempty{margin:auto;color:var(--muted);font-size:13px}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.dglist{display:flex;flex-direction:column;gap:8px}
.dg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--rc)}
.dg.lock{opacity:.5}
.dgh{display:flex;flex-direction:column;gap:2px;grid-column:1}
.dgm{display:flex;gap:14px;font-size:13px;grid-column:1;flex-wrap:wrap}
.dg .btn{grid-column:2;grid-row:1/3}
.dgm .good{color:var(--win)}.dgm .bad{color:var(--lose)}
.arena[hidden]{display:none}
.arena .ahd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fgt{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.fs{display:flex;flex-direction:column;gap:6px;min-width:0}
.fs b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{font-family:var(--display);color:var(--muted)}
.rbar{position:relative;height:20px;border-radius:10px;background:#0b0f1d;overflow:hidden;box-shadow:inset 0 1px 4px #000;transition:filter .1s}
.rbar.hit{filter:brightness(1.8)}
.rbar i{position:absolute;inset:0;width:100%;transition:width .18s ease-out}
.rbar.hp i{background:linear-gradient(90deg,#1fa77a,#3fe0b5)}
.rbar.en i{background:linear-gradient(90deg,#c0392b,#ff6a5a)}
.rbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.rdots{display:flex;gap:8px;justify-content:center;margin:12px 0 8px}
.rdots i{width:28px;height:6px;border-radius:4px;background:#2a3350}
.rdots i.cur{background:var(--brass)}.rdots i.done{background:var(--win)}
.rlog{min-height:112px;font-size:13px;display:flex;flex-direction:column;gap:2px;color:var(--fg)}
.rlog .sys{color:var(--brass2);font-weight:700;margin-top:4px}.rlog .bad{color:#ff9a8a}
.rres{margin-top:10px;padding:12px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2)}
.rres.w{border-color:var(--win)}.rres.l{border-color:var(--lose)}

/* ===== invites ===== */
.ref-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:16px;align-items:start}
@media(max-width:900px){.ref-wrap{grid-template-columns:minmax(0,1fr)}}
.ref-l,.ref-r{display:flex;flex-direction:column;gap:14px;min-width:0}
.reflink{display:flex;gap:8px}
.reflink input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line2);background:#080b16;color:var(--fg);font:inherit;font-size:13px}
.refpend{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.refpend b{font-size:26px;color:var(--brass2)}
.rfrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.rfrow:first-of-type{border-top:0}
.rfd{display:flex;gap:6px;flex-wrap:wrap}
.rfd span{padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.rfd .got{background:rgba(63,224,181,.15);border-color:var(--win);color:var(--win)}
.rfd .rdy{background:rgba(255,194,71,.15);border-color:var(--brass);color:var(--brass2)}
.rfd .wait{border-color:var(--line2);color:var(--fg)}
.rtiers{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rt{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.rt .rn{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brass);color:#1a1202;font-weight:800;flex:none}
.rt .muted{font-size:12px}

</style>

function buildCase(d,i){
  const fam=d.f?new Set(d.f.map(k=>FAMS.findIndex(x=>x.k===k))):null;
  const pool=ITEMS.filter(it=>!fam||fam.has(it.fam));
  const bands=BANDS.map((def,bi)=>{
    const items=pool.filter(it=>it.price>=def.lo*d.p&&it.price<def.hi*d.p).sort((x,y)=>y.price-x.price);
    return {bi,def,items,mean:items.length?items.reduce((s,x)=>s+x.price,0)/items.length:0,prob:0};
  }).filter(b=>b.items.length);
  const target=d.rtp*d.p;
  const probs=lam=>{const w=bands.map(b=>b.def.b*Math.pow(lam,b.bi));const s=w.reduce((x,y)=>x+y,0);return w.map(x=>x/s);};
  const ev=lam=>{const p=probs(lam);return bands.reduce((s,b,k)=>s+p[k]*b.mean,0);};
  let lo=.02,hi=60,lam;
  if(ev(hi)<=target)lam=hi;else if(ev(lo)>=target)lam=lo;
  else{for(let k=0;k<50;k++){const mid=Math.sqrt(lo*hi);if(ev(mid)<target)lo=mid;else hi=mid;}lam=Math.sqrt(lo*hi);}
  const p=probs(lam);bands.forEach((b,k)=>{b.prob=p[k];});
  const hue=(i*37+12)%360;
  const all=bands.reduce((s,b)=>s+b.items.length,0);
  const max=Math.max.apply(null,bands.map(b=>b.items[0].price));
  return {i,name:d.n,price:d.p,bands,rtp:ev(lam)/d.p,count:all,max,hue,art:d.a,
    a:'hsl('+hue+',68%,58%)',ad:'hsl('+hue+',55%,30%)',al:'hsl('+hue+',75%,74%)'};
}
const CASES=CASE_DEFS.map(buildCase);
function pickItem(c,boost){
  const w=c.bands.map(b=>b.prob*(1+(boost||0)*b.bi/3));
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let k=0;k<w.length;k++){r-=w[k];if(r<=0){const it=c.bands[k].items;return it[Math.floor(Math.random()*it.length)];}}
  const l=c.bands[c.bands.length-1].items;return l[l.length-1];
}

function pickNear(price){
  const near=ITEMS.filter(it=>it.price>=price*.9&&it.price<=price*1.12);
  if(near.length)return near[Math.floor(Math.random()*near.length)];
  const s=ITEMS.slice().sort((a,b)=>Math.abs(a.price-price)-Math.abs(b.price-price)).slice(0,3);
  return s[Math.floor(Math.random()*s.length)];
}

}

/* ===== sound ===== */
const sfx=(function(){
  let ac=null;
  function ctx(){
    if(!S.sound)return null;
    try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}catch(e){return null;}
  }
  function beep(f,d,type,vol,when){
    const a=ctx();if(!a)return;
    try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(when||0);
      g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
  }
  return {
    tick(){beep(820+Math.random()*160,.05,'square',.02);},
    win(lv){const n=2+Math.min(4,lv);for(let i=0;i<n;i++)beep(440*Math.pow(1.26,i),.22,'triangle',.06,i*.09);},
    lose(){beep(190,.3,'sawtooth',.035);beep(135,.35,'sawtooth',.035,.12);},
    coin(){beep(1200,.08,'square',.035);beep(1600,.12,'square',.035,.07);},
    stop(){beep(140,.09,'triangle',.06);},
    tease(k){beep(420+k*500,.07,'sine',.05);beep(300+k*300,.1,'triangle',.04,.08);}
  };
})();

  if(S.money!==old){const box=$('#bal');box.classList.remove('up','down');void box.offsetWidth;box.classList.add(S.money>old?'up':'down');}
  updateAdAccess();
  $('#invN').textContent=S.inv.length;

}
function lock(){state.busy=true;document.body.classList.add('busy');updateActions();}
function unlock(){state.busy=false;document.body.classList.remove('busy');updateActions();updateTop();}
function updateActions(){
  const ob=$('#openBtn');
  if(ob){
    const c=state.curCase;
    if(state.busy){ob.textContent='Пропустить';ob.dataset.act='skip';ob.disabled=false;}
    else if(c.free){
      ob.dataset.act='spin';
      if(dailyInfo().can){ob.textContent='Забрать бесплатно';ob.disabled=false;}
      else{ob.textContent='Уже забрано сегодня';ob.disabled=true;}
    }
    else{
      const cost=c.price*S.qty;ob.dataset.act='spin';
      if(S.money<cost){ob.textContent='Не хватает '+fmt(cost-S.money);ob.disabled=true;}
      else{ob.textContent='Открыть ×'+S.qty+' · '+fmt(cost);ob.disabled=false;}
    }
  }
  const bb=$('#btBtn');
  if(bb){
    const B=state.bt,cost=btCost();
    const bi=$('#btInfo');if(bi)bi.textContent='Вход: '+B.rounds+' × '+fmt(CASES[B.ci].price)+' = '+fmt(cost);
    if(state.busy){bb.textContent='Пропустить';bb.dataset.act='skip';bb.disabled=false;}
    else{
      bb.dataset.act='bt-go';
      if(S.money<cost){bb.textContent='Не хватает '+fmt(cost-S.money);bb.disabled=true;}
      else{bb.textContent='Начать битву · '+fmt(cost);bb.disabled=false;}
    }
  }
  if($('#rkBtn'))updateRkBtn();
  const ub=$('#upBtn');if(ub){const mode=upgradeMode(),stake=upStake();if(!state.up.sel.size){ub.disabled=true;ub.textContent='Выбери предметы для ставки';}else if(mode.minStake&&stake<mode.minStake){ub.disabled=true;ub.textContent='Минимальная ставка '+fmt(mode.minStake);}else{ub.textContent='Запустить апгрейд';ub.disabled=state.busy||state.up.target==null||state.up.cash>S.money;}}
  const cb=$('#ctBtn');if(cb)cb.disabled=state.busy||state.ct.sel.size<2||state.ct.cash>S.money;
}

function reelCard(it){const t=TIERS[it.tier];return '<div class="rc" style="--rc:'+t.c+';--rl:'+t.l+'">'+svgFor(it)+'<span class="rn">'+esc(it.name)+'</span><span class="rp mono">'+fmt(it.price)+'</span></div>';}
function geom(reel){
  const strip=reel.firstElementChild,cards=strip.children;
  let step=cards.length>1?cards[1].offsetLeft-cards[0].offsetLeft:0;
  const sm=reel.classList.contains('sm');
  if(!step||step<=0)step=sm?98:126;
  return {strip,step,cw:cards[0].offsetWidth||step-6,vw:reel.clientWidth||600,pad:cards[0].offsetLeft||8};
}
function renderStage(){
  const st=$('#stage');if(!st||state.busy)return;
  const c=state.curCase;const n=c.free?1:S.qty;
  st.innerHTML=Array.from({length:n},()=>{
    const arr=Array.from({length:25},()=>pickItem(c,1.4));
    return '<div class="reel'+(n>1?' sm':'')+'"><div class="strip">'+arr.map(reelCard).join('')+'</div></div>';
  }).join('');
  $$('.reel',st).forEach(r=>{const g=geom(r);g.strip.style.transform='translate3d('+(-(g.pad+12*g.step+g.cw/2-g.vw/2))+'px,0,0)';});
}
function runReels(reels,fast,baseMs){
  return new Promise(resolve=>{
    const base=baseMs||(fast?1300:(RM?2200:5600));
    const t0=performance.now();let lastIdx=-1;
    reels.forEach((r,i)=>{r.dur=base+i*(fast?60:160);r.strip.style.willChange='transform';});
    function frame(now){
      let all=true;
      reels.forEach((r,i)=>{
        const t=state.skip?1:Math.min(1,(now-t0)/r.dur);
        const e=1-Math.pow(1-t,4);
        r.strip.style.transform='translate3d('+(-(r.target*e)).toFixed(1)+'px,0,0)';
        if(i===0){const idx=Math.floor((r.target*e+r.vw/2-r.pad)/r.step);if(idx!==lastIdx){lastIdx=idx;if(t<1)sfx.tick();}}
        if(t<1)all=false;
      });
      if(all){reels.forEach(r=>{r.strip.style.willChange='';});resolve();}else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}
async function spin(){
  if(state.busy||state.curCase==null)return;
  const c=state.curCase,n=c.free?1:S.qty,cost=c.free?0:c.price*n;
  let dinfo=null;
  if(c.free){dinfo=dailyInfo();if(!dinfo.can){toast('Сегодня бонус уже забран. Приходи завтра.');return;}}
  if(S.money<cost){toast('Не хватает '+fmt(cost-S.money)+'. Продай предметы или посмотри рекламу.');return;}
  state.skip=false;state.drop=null;state.newCount=0;
  if(dinfo)S.daily={last:dinfo.today,streak:dinfo.streak,bonus:dinfo.fresh?(+S.daily.bonus||0):Math.max(0,(+S.daily.bonus||0)-1)};
  S.money-=cost;S.stats.opened+=n;S.stats.spent+=cost;
  const wins=Array.from({length:n},()=>pickItem(c));
  const entries=wins.map(it=>{S.stats.best=Math.max(S.stats.best,it.price);return addItem(it);});
  save();
  lock();
  $('#drop').innerHTML='';
  const LEN=n>=6?36:(n>=3?46:64),WIN=LEN-16+Math.floor(Math.random()*4);
  const st=$('#stage');
  st.innerHTML=wins.map(w=>{
    const arr=Array.from({length:LEN},()=>pickItem(c,1.4));arr[WIN]=w;
    return '<div class="reel'+(n>1?' sm':'')+'"><div class="strip">'+arr.map(reelCard).join('')+'</div></div>';
  }).join('');
  const reels=$$('.reel',st).map(r=>{
    const g=geom(r);
    g.target=g.pad+WIN*g.step+g.cw/2+rnd(-.36,.36)*g.cw-g.vw/2;
    g.el=r;return g;
  });
  await sleep(60);
  await runReels(reels,S.fast);
  reels.forEach(r=>{$$('.rc',r.el).forEach((el,i)=>{if(i===WIN)el.classList.add('win');else el.classList.add('dim');});});
  const total=wins.reduce((s,w)=>s+w.price,0);
  const hit=wins.some(w=>w.price>=c.price*9);
  if(!c.free){if(total<cost){S.stats.lost=(S.stats.lost||0)+(cost-total);S.stats.losses=(S.stats.losses||0)+1;}else if(total>cost)S.stats.wins=(S.stats.wins||0)+1;save();}
  state.drop={wins,uids:entries.map(e=>e.uid),cost,total,sold:false,hit,fresh:state.newCount};
  publishDrops(c,wins);
  if(hit)sfx.win(6);else if(total>=cost)sfx.win(1);else sfx.lose();
  unlock();
  showDrop(state.drop);
  if(hit)toast('Крупный дроп!');
  afterAction();
}
function showDrop(d){
  const box=$('#drop');if(!box)return;
  const diff=d.total-d.cost;
  box.innerHTML='<div class="drop'+(d.hit?' flash':'')+'"><div class="dh"><div><div class="muted">Выпало на сумму</div><div class="mono big">'+fmt(d.total)+'</div></div>'+
    '<div class="delta mono '+(diff>=0?'pos':'neg')+'">'+(diff>=0?'+':'−')+fmt(Math.abs(diff))+'</div></div>'+
    '<div class="igrid">'+d.wins.map(w=>card(w)).join('')+'</div>'+
    (d.fresh?'<div class="muted">Новых предметов в коллекции: <b>'+d.fresh+'</b></div>':'')+
    '<div class="row">'+(d.sold?'<span class="muted">Продано. Деньги на балансе.</span>':'<button type="button" class="btn" data-act="sell-drop">Продать всё · '+fmt(d.total)+'</button><span class="muted">или оставь в инвентаре</span>')+'</div></div>';
}

// Коэффициенты апгрейда заданы отдельно для каждого режима.
// Поражение во всех режимах возвращает 25% от общей ставки.
const UPGRADE_MODES={
  // Простое колесо: цель всегда ×2 от ставки, шанс выбирает игрок.
  '0.75':{normalChance:.75,jackpotChance:0,normalCoef:2,jackpotCoef:0,minStake:0},
  '0.5': {normalChance:.50,jackpotChance:0,normalCoef:2,jackpotCoef:0,minStake:0},
  '0.3': {normalChance:.30,jackpotChance:0,normalCoef:2,jackpotCoef:0,minStake:0},
  '0.1': {normalChance:.10,jackpotChance:0,normalCoef:2,jackpotCoef:0,minStake:0}
};
function upgradeMode(){return UPGRADE_MODES[String(state.up.chance)]||UPGRADE_MODES['0.5'];}
const upChance=()=>{const m=upgradeMode();return m.normalChance+m.jackpotChance;};
function upCands(){
  const U=state.up;if(!U.sel.size)return [];
  const s=upStake();if(s<=0)return [];
  const m=upgradeMode(),ideal=s*m.normalCoef;
  const family=it=>U.fam==='all'||FAMS[it.fam].k===U.fam;
  // Цель не дороже обычной выплаты; недостающая до выплаты разница приходит деньгами.
  const pool=ITEMS.filter(it=>family(it)&&it.price<=ideal);
  if(!pool.length)return [];
  const near=pool.filter(it=>it.price>=ideal*.55);
  return (near.length?near:pool)
    .sort((a,b)=>Math.abs(Math.log(Math.max(1,a.price)/Math.max(1,ideal)))-Math.abs(Math.log(Math.max(1,b.price)/Math.max(1,ideal))))
    .slice(0,24);
}
function upEV(m){return m.normalChance*m.normalCoef+m.jackpotChance*m.jackpotCoef+(1-m.normalChance-m.jackpotChance)*.25;}
function mCoef(n){return n.toFixed(2).replace('.',',').replace(/,?0+$/,'');}

  out+='Проигрыш: <b>'+pct(loss)+'</b> · возврат ×0,25 (25%).';

  return out;
}

async function doUpgrade(){
  const U=state.up;
  if(state.busy||U.target==null||!U.sel.size)return;
  const cash=Math.min(Math.max(0,Math.floor(+U.cash||0)),S.money);
  const stake=upStake(),it=ITEMS[U.target],mode=upgradeMode();
  if(!upCands().some(x=>x.id===U.target))return;
  if(mode.minStake&&stake<mode.minStake){toast('Для режима '+Math.round(U.chance*100)+'% минимальная общая ставка — '+fmt(mode.minStake)+'.');return;}
  const roll=Math.random(),totalChance=mode.normalChance+mode.jackpotChance;
  const jackpot=mode.jackpotChance>0&&roll>=mode.normalChance&&roll<totalChance;
  const normalWin=roll<mode.normalChance;
  const win=normalWin||jackpot;
  const coef=jackpot?mode.jackpotCoef:mode.normalCoef;
  const ch=totalChance,normalArc=mode.normalChance*360,totalArc=ch*360;
  let ang;
  if(normalWin)ang=rnd(1,Math.max(2,normalArc-1));
  else if(jackpot)ang=rnd(normalArc+.1,Math.max(normalArc+.2,totalArc-.1));
  else ang=rnd(Math.min(356,totalArc+1),357);
  lock();U.res=null;
  // Исход и выплата записываются сразу: перезагрузка страницы во время вращения ничего не отнимает и не даёт.
  S.money-=cash;U.cash=0;
  removeUids(new Set(U.sel));
  S.stats.upgrades=(S.stats.upgrades||0)+1;
  let cashback=0,bonus=0;
  if(win){
    addItem(it);S.stats.best=Math.max(S.stats.best,it.price);S.stats.upgradeWins=(S.stats.upgradeWins||0)+1;S.stats.wins=(S.stats.wins||0)+1;
    if(jackpot)S.stats.upgradeJackpots=(S.stats.upgradeJackpots||0)+1;
    bonus=Math.max(0,Math.floor(stake*coef-it.price));
    S.money+=bonus;S.stats.earned=(S.stats.earned||0)+bonus;
  }else{
    cashback=Math.floor(stake*.25);S.money+=cashback;S.stats.earned=(S.stats.earned||0)+cashback;
    S.stats.lost=(S.stats.lost||0)+Math.max(0,stake-cashback);S.stats.losses=(S.stats.losses||0)+1;S.stats.upgradeLosses=(S.stats.upgradeLosses||0)+1;
  }
  save();$('#upMsg').innerHTML='';
  const dur=S.fast?1400:(RM?2200:5200),ptr=$('#ptr');
  U.rot=U.rot+360*(5+Math.floor(Math.random()*3))+(((ang-(U.rot%360))%360)+360)%360;
  ptr.style.transition='transform '+dur+'ms cubic-bezier(.10,.72,.08,1)';
  ptr.style.transform='rotate('+U.rot+'deg)';
  let ticking=true,tickTimer=0;const tickStart=performance.now();
  function tickWheel(){if(!ticking)return;sfx.tick();const p=Math.min(1,(performance.now()-tickStart)/dur);tickTimer=setTimeout(tickWheel,42+360*p*p);}
  tickWheel();
  await sleep(dur+80);ticking=false;clearTimeout(tickTimer);
  U.res=jackpot?'jackpot':win?'win':'lose';
  if(win)sfx.win(Math.min(6,Math.round(Math.log(Math.max(1,coef))/Math.log(1.8))));else sfx.lose();
  updateTop();
  $('#upMsg').innerHTML=win?'<div class="cres">'+card(it,{cls:'pop'})+'<div><div class="verdict v2">'+(jackpot?'ДЖЕКПОТ!':'Цель получена')+'</div><div class="muted">'+(jackpot?'Джекпот выпал с шансом '+pct(mode.jackpotChance)+'. ':'Обычный выигрыш с шансом '+pct(mode.normalChance)+'. ')+'Коэффициент '+('×'+mCoef(coef))+'.</div><div class="mono">Ставка '+fmt(stake)+' · денежная доплата к награде '+fmt(bonus)+'</div></div></div>':
    '<div class="cres"><div><div class="verdict v0">Не повезло</div><div class="muted">Шанс выигрыша был '+pct(ch)+'. Потеряно '+fmt(Math.max(0,stake-cashback))+' с учётом возврата.</div><div class="verdict v2">+'+fmt(cashback)+' возврат · 25%</div></div></div>';
  U.sel.clear();U.target=null;
  unlock();ptr.style.transition='none';drawUpInv();refreshUp();
  afterAction();
}

function ctItems(){state.ct.sel.forEach(u=>{if(!entry(u))state.ct.sel.delete(u);});return Array.from(state.ct.sel).map(u=>ITEMS[entry(u).id]);}
const CONTRACT_RETURN=.97;
function contractBands(risk){
  const r=Math.max(0,Math.min(1,risk||0));
  const bands=[
    {n:'Провал',lo:.08-.04*r,hi:.9,c:'#ee5b5b',p:.64+.07*r},
    {n:'Около нуля',lo:.9,hi:1.5+.25*r,c:'#8e9db0',p:.24-.02*r},
    {n:'Хороший',lo:1.5,hi:3+1.5*r,c:'#35c7a6',p:.09-.035*r},
    {n:'Джекпот',lo:3,hi:6+6*r,c:'#e8b24a',p:.03-.015*r}
  ];
  // Сохраняем распределение исходов, но масштабируем их так, чтобы
  // среднее математическое ожидание было 97% от стоимости контракта.
  const rawEV=bands.reduce((sum,b)=>sum+b.p*(b.lo+b.hi)/2,0);
  const scale=CONTRACT_RETURN/rawEV;
  return bands.map(b=>({...b,lo:b.lo*scale,hi:b.hi*scale}));
}
function rollContract(risk){
  const bands=contractBands(risk);let r=Math.random(),acc=0;
  for(const b of bands){acc+=b.p;if(r<acc)return rnd(b.lo,b.hi);}
  const b=bands[bands.length-1];return rnd(b.lo,b.hi);
}
function oddsHTML(V,risk){
  const bands=contractBands(risk),ev=bands.reduce((s,b)=>s+b.p*(b.lo+b.hi)/2,0);
  return '<div class="obar">'+bands.map(b=>'<i style="flex:'+b.p+';background:'+b.c+'"></i>').join('')+'</div>'+    '<ul class="olist">'+bands.map(b=>'<li><i style="background:'+b.c+'"></i><span>'+b.n+'</span><span class="mono">'+fmt(V*b.lo)+' – '+fmt(V*b.hi)+'</span><b class="mono">'+Math.round(b.p*100)+'%</b></li>').join('')+'</ul>'+    '<p class="muted" style="margin-top:8px">Расчётный средний возврат ≈ '+Math.round(ev*100)+'% ставки. Это игровая случайность, гарантии прибыли нет.</p>';
}

async function doBattle(){

function rkSize(){

function rkDraw(){
  const c=rk.ctx;if(!c)return;
  const W=rk.w,H=rk.h,pl=44,pr=16,pt=16,pb=28;
  c.setTransform(rk.dpr,0,0,rk.dpr,0,0);c.clearRect(0,0,W,H);
  const tMax=Math.max(8,rk.t*1.12),mMax=Math.max(2,rk.m*1.18);
  const X=t=>pl+(W-pl-pr)*t/tMax,Y=m=>H-pb-(H-pb-pt)*(m-1)/(mMax-1);
  c.font='11px "JetBrains Mono",monospace';c.textBaseline='middle';
  [1,1.5,2,3,5,10,20,50,100,200,500].filter(v=>v<=mMax).forEach(v=>{
    const y=Y(v);c.strokeStyle='#1d2a38';c.lineWidth=1;c.beginPath();c.moveTo(pl,y);c.lineTo(W-pr,y);c.stroke();
    c.fillStyle='#8e9db0';c.textAlign='right';c.fillText(String(v).replace('.',',')+'×',pl-6,y);
  });
  const col=rk.phase==='crash'?'#ee5b5b':rk.phase==='cash'?'#35c7a6':'#e8b24a';
  const N=120,pts=[];
  for(let i=0;i<=N;i++){const t=rk.t*i/N;pts.push([X(t),Y(Math.exp(RK_K*t))]);}
  c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
  c.lineTo(pts[N][0],H-pb);c.lineTo(pts[0][0],H-pb);c.closePath();
  const g=c.createLinearGradient(0,pt,0,H-pb);g.addColorStop(0,col+'55');g.addColorStop(1,col+'05');c.fillStyle=g;c.fill();
  c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
  c.strokeStyle=col;c.lineWidth=3;c.lineJoin='round';c.stroke();
  const hx=pts[N][0],hy=pts[N][1];
  if(rk.phase==='crash'){
    c.save();c.translate(hx,hy);
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2,l=14+(i%3)*8;c.strokeStyle=i%2?'#ff8a3a':'#ee5b5b';c.lineWidth=3;c.beginPath();c.moveTo(Math.cos(a)*5,Math.sin(a)*5);c.lineTo(Math.cos(a)*l,Math.sin(a)*l);c.stroke();}
    c.restore();
  }else if(rk.phase==='cash'){
    c.fillStyle='#35c7a6';c.beginPath();c.arc(hx,hy,7,0,Math.PI*2);c.fill();
  }else{
    const dy=-(H-pb-pt)*RK_K*rk.m/(mMax-1),dx=(W-pl-pr)/tMax,ang=Math.atan2(dy,dx);

    c.fillStyle='#ff8a3a';c.beginPath();c.moveTo(-9,-3);c.lineTo(-20-(rk.phase==='fly'?Math.random()*8:2),0);c.lineTo(-9,3);c.closePath();c.fill();
    c.fillStyle='#ee5b5b';c.beginPath();c.moveTo(-3,-5);c.lineTo(-11,-11);c.lineTo(-9,-3);c.closePath();c.fill();
    c.beginPath();c.moveTo(-3,5);c.lineTo(-11,11);c.lineTo(-9,3);c.closePath();c.fill();
    c.fillStyle='#e9eef3';c.beginPath();c.moveTo(15,0);c.quadraticCurveTo(4,-7,-9,-5);c.lineTo(-9,5);c.quadraticCurveTo(4,7,15,0);c.fill();
    c.fillStyle='#4a7cff';c.beginPath();c.arc(3,0,2.4,0,Math.PI*2);c.fill();
    c.restore();
  }
}

// положение барабана в «клетках»: быстрый разгон, плавное торможение, лёгкий отскок при остановке
function slPos(p,t){
  const T=p.N-4;
  let c=T*(1-Math.pow(1-t,p.k));
  if(t<.1)c-=.32*Math.sin(Math.PI*t/.1);
  const u=Math.max(0,Math.min(1,(t-.8)/.2));c+=.2*Math.sin(Math.PI*u)*(1-.5*u);
  return c;
}
function slAnimate(plans,tease){
  return new Promise(resolve=>{
    const t0=performance.now(),last=[-1,-1,-1],done=[0,0,0];let lastTick=0,beat=0;
    function frame(now){
      let all=true;
      plans.forEach((p,i)=>{
        const t=state.skip?1:Math.max(0,Math.min(1,(now-t0)/p.D));
        const c=slPos(p,t);
        p.strip.style.transform='translate3d(0,'+(-(p.N-3-c)*p.h).toFixed(1)+'px,0)';
        const idx=Math.floor(c);
        if(t<1&&idx!==last[i]){last[i]=idx;if(now-lastTick>55){lastTick=now;sfx.tick();}}
        if(tease&&i===2&&t>.45&&t<1&&now>beat){sfx.tease((t-.45)/.55);beat=now+420-280*((t-.45)/.55);}
        if(t>=1){if(!done[i]){done[i]=1;p.strip.parentNode.classList.add('landed');sfx.stop();setTimeout(()=>p.strip.parentNode.classList.remove('landed'),260);}}
        else all=false;
      });
      if(all)resolve();else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

  else{L.auto=0;slUI();}
}

const RPG_K={H:5.5,A:.78,D:.33},RPG_ROOMS=4,RPG_MAXLVL=30;
const rpgP=pr=>Math.sqrt(pr);
const rpgNeed=l=>Math.round(40*Math.pow(l,1.5));
const rpgFee=d=>Math.max(25,Math.round(TIERS[d].base*.35));
function rpgH(){
  let h=S.hero;
  if(!h||typeof h!=='object')h=S.hero={};
  h.lvl=Math.min(RPG_MAXLVL,Math.max(1,h.lvl|0||1));h.xp=Math.max(0,+h.xp||0);h.max=Math.max(0,Math.min(TIERS.length,h.max|0));
  if(!h.eq||typeof h.eq!=='object')h.eq={};
  RPG_SLOTS.forEach(s=>{const e=h.eq[s.k];if(!e||!ITEMS[e.id]||rpgSlotOf(ITEMS[e.id])!==s)h.eq[s.k]=null;});
  return h;
}
function rpgStats(){
  const h=rpgH();let hp=80+9*h.lvl,atk=6+1.2*h.lvl,def=1+.4*h.lvl;
  const bon={};
  RPG_SLOTS.forEach(s=>{const e=h.eq[s.k];if(!e)return;const p=rpgP(ITEMS[e.id].price);
    if(s.k==='weapon'){atk+=p;bon[s.k]='АТК +'+Math.round(p);}
    else if(s.k==='armor'){def+=p*.5;hp+=p*4;bon[s.k]='ЗАЩ +'+Math.round(p*.5)+' · ЗДР +'+Math.round(p*4);}
    else if(s.k==='head'){def+=p*.25;hp+=p*3;bon[s.k]='ЗАЩ +'+Math.round(p*.25)+' · ЗДР +'+Math.round(p*3);}
    else{atk+=p*.35;hp+=p*2;bon[s.k]='АТК +'+Math.round(p*.35)+' · ЗДР +'+Math.round(p*2);}});
  return {hp:Math.round(hp),atk:Math.round(atk*10)/10,def:Math.round(def*10)/10,bon};
}
function rpgEnemy(d,r){
  const p=rpgP(TIERS[d].base*1.1),b=r===RPG_ROOMS-1,m=1+(b?.45:.12*r);
  return {name:RPG_NAMES[d][r+1],hp:Math.round(RPG_K.H*p*m*(b?1.5:1)*(1+.1*r)),atk:RPG_K.A*p*m,def:RPG_K.D*p*m};
}
function rpgHit(a,dv){const x=a*(.5+Math.random())*(Math.random()<.12?2.2:1);return Math.max(1,x*(.9*a)/(dv+.9*a));}
// events: [room, who(0 герой бьёт, 1 враг), dmg, crit, heroHp, enemyHp]
function rpgFight(d,st,rec){
  let hp=st.hp,cleared=0;const ev=[];
  for(let r=0;r<RPG_ROOMS;r++){
    const e=rpgEnemy(d,r);let eh=e.hp,t=0;
    while(eh>0&&hp>0&&t++<300){
      let x=rpgHit(st.atk,e.def);eh-=x;
      if(rec)ev.push([r,0,Math.round(x),x>st.atk*1.1&&0,rpgR(hp),rpgR(eh)]);
      if(eh<=0)break;
      x=rpgHit(e.atk,st.def);hp-=x;
      if(rec)ev.push([r,1,Math.round(x),0,rpgR(hp),rpgR(eh)]);
    }
    if(hp<=0)break;cleared++;
  }
  return {won:cleared===RPG_ROOMS,cleared,ev,hpLeft:Math.max(0,hp)};
}
const rpgR=v=>v<=0?0:Math.max(1,Math.round(v));
const rpgCache={};
function rpgChance(d,st){
  const key=d+'|'+st.hp+'|'+st.atk+'|'+st.def;
  if(rpgCache[key]!=null)return rpgCache[key];
  let w=0;const n=240;for(let i=0;i<n;i++)if(rpgFight(d,st,false).won)w++;
  const keys=Object.keys(rpgCache);if(keys.length>80)delete rpgCache[keys[0]];
  return rpgCache[key]=w/n;
}
function rpgLoot(d){
  if(Math.random()>.32)return null;
  const W=[[d-1,45],[d,38],[d+1,14],[d+2,3]],tot=100;let r=Math.random()*tot,t=d;
  for(const w of W){r-=w[1];if(r<0){t=w[0];break;}}
  t=Math.max(0,Math.min(TIERS.length-1,t));
  const pool=ITEMS.filter(it=>it.tier===t);return pool[Math.floor(Math.random()*pool.length)];
}

async function loadLeaderboard(){
  const base=apiBase(),category=state.lbCategory,token=++state.lbRequest,status=$('#lbStatus');

  try{
    const resp=await fetch(base+'/api/leaderboard?category='+encodeURIComponent(category),{cache:'no-store'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();if(token!==state.lbRequest)return;
    let rows=Array.isArray(data.entries)?data.entries:[];
    if(!rows.some(isMe)){const me=localProfile();rows=rows.concat([me]);}
    rows.sort((a,b)=>(+b[category]||0)-(+a[category]||0));
    drawLeaderboardRows(rows.slice(0,50),category);
    if(status)status.textContent='Игроков в рейтинге: '+(Number(data.total)||rows.length)+'. Обновлено в '+dropTime(Date.now())+'.';

  },
  'col-claim'(t){
    const i=+t.dataset.i,m=MILES[i];
    if(!m||S.claimed.includes(i)||SEEN.size<m[0])return;
    S.claimed.push(i);S.money+=m[1];S.stats.earned=(S.stats.earned||0)+m[1];save();sfx.win(4);updateTop();toast('+'+fmt(m[1])+' за коллекцию');viewCollection($('#app'));
  },
  more(){const s=$('#sheet'),b=$('#sheetBg'),o=!s.classList.contains('open');s.classList.toggle('open',o);b.classList.toggle('open',o);},
  'case-tier'(t){state.cf.tier=+t.dataset.i;$$('#caseTier .chip').forEach(b=>b.classList.toggle('on',+b.dataset.i===state.cf.tier));drawCases();},
  'case-reset'(){state.cf.q='';state.cf.tier=0;viewCases($('#app'));},
  'lb-save'(){const n=$('#playerName');if(n)S.nickname=(n.value||'Игрок').replace(/[<>\\]/g,'').trim().slice(0,22)||'Игрок';save();toast('Имя сохранено');loadLeaderboard();},
  snd(){S.sound=!S.sound;save();updateTop();if(S.sound)sfx.coin();}
};
function setQty(n){
  if(state.busy)return;
  S.qty=Math.min(10,Math.max(1,n));save();
  const qv=$('#qv');if(qv)qv.textContent=S.qty;
  $$('#qchips .chip').forEach(b=>b.classList.toggle('on',+b.dataset.n===S.qty));
  renderStage();updateActions();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  const f=H[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-fast]')){S.fast=t.checked;save();$$('[data-fast]').forEach(x=>{x.checked=S.fast;});}
  else if(t.id==='invSort'){state.invSort=t.value;drawInv();}
  else if(t.id==='upFam'){state.up.fam=t.value;state.up.target=null;state.up.res=null;refreshUp();}
  else if(t.id==='upCash'){state.up.cash=Math.min(S.money,Math.max(0,Math.floor(+t.value||0)));refreshUp();}
  else if(t.id==='ctCash'){state.ct.cash=Math.min(S.money,Math.max(0,Math.floor(+t.value||0)));drawCt();}
  else if(t.id==='diceChance'){state.games.diceChance=+t.value;}
  else if(t.id==='playerName'){}
  else if(t.id==='caseSort'){state.cf.sort=t.value;drawCases();}
  else if(t.id==='btCase'){if(state.busy)return;state.bt.ci=+t.value;drawBtStage();updateActions();}
  else if(t.id==='btRoundsRange'){if(state.busy)return;state.bt.rounds=Math.max(1,Math.min(10,+t.value||1));drawBtStage();updateActions();}
  else if(t.id==='rkBet'){const r=$('#rkBetRange'),v=$('#rkBetValue'),n=Math.max(10,Math.min(S.money,Math.floor(+t.value||10)));t.value=n;if(r)r.value=Math.min(+r.max,n);if(v)v.textContent=fmt(n);updateRkBtn();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#adm').hidden)closeAd();});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='caseQ'){state.cf.q=t.value;clearTimeout(drawCases.h);drawCases.h=setTimeout(drawCases,140);}
  else if(t.id==='rkBetRange'){
    if(rk.phase==='fly')return;
    const n=Math.max(10,Math.min(S.money,Math.floor(+t.value||10))),bi=$('#rkBet'),v=$('#rkBetValue');
    if(bi)bi.value=n;if(v)v.textContent=fmt(n);updateRkBtn();
  }else if(t.id==='rkBet'){
    const n=Math.max(10,Math.min(S.money,Math.floor(+t.value||10))),r=$('#rkBetRange'),v=$('#rkBetValue');
    if(r)r.value=Math.min(+r.max,n);if(v)v.textContent=fmt(n);updateRkBtn();
  }else if(t.id==='gameBetRange'){
    state.games.bet=Math.max(10,Math.min(S.money,Math.floor(+t.value||10)));
    const v=$('#gameBetValue');if(v)v.textContent=fmt(state.games.bet);
  }else if(t.id==='btRoundsRange'){
    if(state.busy)return;state.bt.rounds=Math.max(1,Math.min(10,+t.value||1));
    const v=$('#btRoundsValue');if(v)v.textContent=state.bt.rounds+' шт.';
    const info=$('#btInfo');if(info)info.textContent='Вход: '+state.bt.rounds+' × '+fmt(CASES[state.bt.ci].price)+' = '+fmt(btCost());updateActions();
  }else if(t.id==='upCashRange'){
    if(state.busy)return;state.up.cash=Math.min(S.money,Math.max(0,Math.floor(+t.value||0)));
    const v=$('#upCash');if(v)v.value=state.up.cash;raf1('up',refreshUp);
  }else if(t.id==='ctCashRange'){
    if(state.busy)return;state.ct.cash=Math.min(S.money,Math.max(0,Math.floor(+t.value||0)));
    const v=$('#ctCash');if(v)v.value=state.ct.cash;raf1('ct',drawCt);
  }
});
window.addEventListener('resize',()=>{if(state.tab==='rocket'&&!state.curCase&&$('#rkc')){rkSize();rkDraw();}});

render();
queueOnlineSync();
setInterval(dailyTick,1000);
setInterval(()=>{if(document.hidden)return;if(!state.curCase&&state.tab==='drops')loadDrops(false);refreshDropTicker();},6000);
refreshDropTicker();
})();
</script>

</body>
</html>
